<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">데이터와 화면의 책임 비교</title><desc id="d">ConstellationModel과 ConstellationRenderer가 각각 맡는 일을 나란히 비교한 표</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263654"/><stop offset="1" stop-color="#0e111c"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#8adfff" stop-opacity=".07"/></linearGradient><marker id="head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#42c8ff"/></marker><marker id="headw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8faabd"/></marker></defs>
  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">데이터와 화면의 책임 나누기</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">ConstellationModel 과 ConstellationRenderer</text><rect x="56" y="180" width="470" height="300" rx="22" fill="#111726" stroke="#ffd14a" stroke-width="2"/><rect x="56" y="180" width="6" height="300" rx="3" fill="#ffd14a"/><text x="82" y="224" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="25" font-weight="650" text-anchor="start">ConstellationModel</text><text x="82" y="264" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">무엇을 저장할지 결정</text><text x="82" y="296" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">너무 가까운 점 거절</text><text x="82" y="328" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">최대 개수 검사</text><text x="82" y="360" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">새 별자리 시작 여부 판단</text><text x="82" y="392" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">RealityKit을 import 하지 않음</text><rect x="574" y="180" width="470" height="300" rx="22" fill="#111726" stroke="#42c8ff" stroke-width="2"/><rect x="574" y="180" width="6" height="300" rx="3" fill="#42c8ff"/><text x="600" y="224" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="25" font-weight="650" text-anchor="start">ConstellationRenderer</text><text x="600" y="264" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">무엇을 보여 줄지 결정</text><text x="600" y="296" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">구와 원기둥 mesh 생성</text><text x="600" y="328" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">선분의 위치와 회전 계산</text><text x="600" y="360" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">커서 크기 갱신</text><text x="600" y="392" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">규칙을 스스로 판단하지 않음</text><line x1="532" y1="330" x2="568" y2="330" stroke="#42c8ff" stroke-width="5" stroke-linecap="round"/><path d="M0 0 L-15 8.25 L-15 -8.25 z" fill="#42c8ff" transform="translate(568 330) rotate(0.0)"/><text x="550" y="300" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="400" text-anchor="middle">확정된 점만 전달</text><rect x="56" y="512" width="988" height="148" rx="20" fill="#131b2b" stroke="#32b466" stroke-width="2"/><text x="88" y="556" fill="#32b466" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="650" text-anchor="start">이렇게 나누면 좋은 점</text><text x="88" y="598" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">모델은 ARKit과 RealityKit 없이 macOS에서 그대로 테스트할 수 있습니다.</text><text x="88" y="630" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">화면 표현을 바꿔도 별자리 규칙은 손대지 않습니다.</text>
</svg>
