<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">RealityKit 엔티티 트리</title><desc id="d">rootEntity 아래에 흰 선, 흰 점, 기존 점 연결 안내 컨테이너와 커서가 자식으로 붙은 구조도</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263654"/><stop offset="1" stop-color="#0e111c"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#8adfff" stop-opacity=".07"/></linearGradient><marker id="head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#42c8ff"/></marker><marker id="headw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8faabd"/></marker></defs>
  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">RealityKit 엔티티 트리</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">ConstellationRenderer.rootEntity</text><rect x="400" y="170" width="300" height="96" rx="20" fill="#111726" stroke="#42c8ff" stroke-width="3"/><text x="550" y="214" fill="#42c8ff" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="24" font-weight="650" text-anchor="middle">rootEntity</text><text x="550" y="246" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="400" text-anchor="middle">장면에 추가되는 단 하나의 부모</text><path d="M550 266 V 320 H 154 V 366" fill="none" stroke="#3a4a63" stroke-width="3"/><rect x="36" y="366" width="236" height="118" rx="20" fill="#111726" stroke="#f5f7fa" stroke-width="2"/><text x="154" y="412" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="17" font-weight="650" text-anchor="middle">lineContainer</text><text x="154" y="448" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="400" text-anchor="middle">흰 확정 선분</text><path d="M550 266 V 320 H 410 V 366" fill="none" stroke="#3a4a63" stroke-width="3"/><rect x="292" y="366" width="236" height="118" rx="20" fill="#111726" stroke="#f5f7fa" stroke-width="2"/><text x="410" y="412" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="17" font-weight="650" text-anchor="middle">pointContainer</text><text x="410" y="448" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="400" text-anchor="middle">흰 구 점</text><path d="M550 266 V 320 H 666 V 366" fill="none" stroke="#3a4a63" stroke-width="3"/><rect x="548" y="366" width="236" height="118" rx="20" fill="#111726" stroke="#f5f7fa" stroke-width="2"/><text x="666" y="412" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="17" font-weight="650" text-anchor="middle">guidanceContainer</text><text x="666" y="448" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="400" text-anchor="middle">연결 대상·미리보기</text><path d="M550 266 V 320 H 922 V 366" fill="none" stroke="#3a4a63" stroke-width="3"/><rect x="804" y="366" width="236" height="118" rx="20" fill="#111726" stroke="#f5f7fa" stroke-width="2"/><text x="922" y="412" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="17" font-weight="650" text-anchor="middle">cursor</text><text x="922" y="448" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="400" text-anchor="middle">흰 검지 커서</text><rect x="56" y="528" width="988" height="132" rx="20" fill="#131b2b" stroke="#3a4a63" stroke-width="2"/><text x="88" y="572" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="650" text-anchor="start">컨테이너를 나누면</text><text x="88" y="612" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">초기화할 때 확정 점·선과 연결 안내를 지우고 커서 엔티티는 재사용합니다.</text><text x="88" y="644" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">목표 점 강조와 미리보기 선은 guidanceContainer 안에서만 켜고 끕니다.</text>
</svg>
