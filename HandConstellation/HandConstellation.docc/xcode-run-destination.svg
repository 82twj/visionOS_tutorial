<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">Apple Vision Pro 실행 대상 선택</title><desc id="d">Xcode 도구 막대에서 실행 대상으로 Apple Vision Pro를 고른 모습과, 기기 실행 전에 확인할 것, Simulator와 다른 점을 정리한 개념도</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263654"/><stop offset="1" stop-color="#0e111c"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#8adfff" stop-opacity=".07"/></linearGradient><marker id="head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#42c8ff"/></marker><marker id="headw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8faabd"/></marker></defs>
  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">Apple Vision Pro를 실행 대상으로</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">개념도 · Xcode 도구 막대의 실행 대상</text><rect x="72" y="176" width="956" height="120" rx="20" fill="#0b1120" stroke="#3a4a63" stroke-width="2"/><path d="M118 236 l0 -20 l24 20 l-24 20 z" fill="#32b466"/><rect x="176" y="204" width="400" height="66" rx="14" fill="#131b2b" stroke="#3a4a63" stroke-width="2"/><text x="200" y="244" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="21" font-weight="600" text-anchor="start">HandConstellation</text><rect x="600" y="204" width="396" height="66" rx="14" fill="#131b2b" stroke="#1677ff" stroke-width="4"/><text x="628" y="244" fill="#42c8ff" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="650" text-anchor="start">Apple Vision Pro</text><text x="886" y="244" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="start">내 기기</text><rect x="72" y="330" width="460" height="330" rx="22" fill="#111726" stroke="#32b466" stroke-width="2"/><text x="104" y="378" fill="#32b466" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="650" text-anchor="start">먼저 확인할 것</text><text x="104" y="424" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">Signing &amp; Capabilities 탭에서</text><text x="104" y="460" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">Team을 본인 팀으로 골랐는지</text><text x="104" y="496" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">Bundle Identifier를 본인만 쓰는</text><text x="104" y="532" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">값으로 바꿨는지</text><text x="104" y="568" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">Vision Pro를 Xcode와 페어링하고</text><text x="104" y="604" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">Developer Mode를 켰는지</text><rect x="568" y="330" width="460" height="330" rx="22" fill="#111726" stroke="#ff6a3d" stroke-width="2"/><text x="600" y="378" fill="#ff6a3d" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="650" text-anchor="start">Simulator와 다른 점</text><text x="600" y="424" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">Simulator에서는 ARKit 손 추적을</text><text x="600" y="460" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">쓸 수 없습니다.</text><text x="600" y="496" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">손 추적 권한 창과 실제 손으로</text><text x="600" y="532" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">점과 선을 그리는 것은</text><text x="600" y="568" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">Vision Pro에서 확인합니다.</text>
</svg>
