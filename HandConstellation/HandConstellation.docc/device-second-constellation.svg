 SD Gothic Neo',sans-serif" font-size="20" font-weight="650" text-anchor="middle">여기에 선이 없어야 합니다</text><text x="300" y="214" fill="#ffd14a" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="650" text-anchor="middle">첫 번째 별자리</text><text x="846" y="214" fill="#ffd14a" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="650" text-anchor="middle">두 번째 별자리</text><rect x="56" y="606" width="988" height="62" rx="16" fill="#131b2b" stroke="#32b466" stroke-width="2"/><text x="88" y="644" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">창의 표시가 별자리 2개 · 점 7개 가 되면 별자리 분리가 올바르게 동작한 것입니다.</text>
