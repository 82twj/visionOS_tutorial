<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">버튼으로 그리기 상태 전환</title><desc id="d">그리기 켜기와 끄기 버튼이 공유 AppModel의 상태를 변경하는 개념도</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263654"/><stop offset="1" stop-color="#0e111c"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#8adfff" stop-opacity=".07"/></linearGradient><marker id="head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#42c8ff"/></marker><marker id="headw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8faabd"/></marker></defs>
  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">버튼으로 공유 상태 바꾸기</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">개념도 · 제어창과 몰입형 공간이 같은 AppModel을 읽습니다</text><rect x="56" y="170" width="450" height="280" rx="22" fill="#111726" stroke="#8faabd" stroke-width="2"/><rect x="56" y="170" width="6" height="280" rx="3" fill="#8faabd"/><text x="82" y="214" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="25" font-weight="650" text-anchor="start">그리기 꺼짐</text><text x="82" y="254" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">drawingState = .disabled</text><text x="82" y="286" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">손을 움직여도 새 점을 만들지 않습니다.</text><text x="82" y="318" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">기존 별자리는 화면에 남습니다.</text><rect x="594" y="170" width="450" height="280" rx="22" fill="#111726" stroke="#32b466" stroke-width="2"/><rect x="594" y="170" width="6" height="280" rx="3" fill="#32b466"/><text x="620" y="214" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="25" font-weight="650" text-anchor="start">그리기 켜짐</text><text x="620" y="254" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">drawingState = .enabled</text><text x="620" y="286" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">검지를 0.8초 머물러 점을 만듭니다.</text><text x="620" y="318" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">기존 점에 머물러 선을 연결합니다.</text><line x1="300" y1="500" x2="800" y2="500" stroke="#32b466" stroke-width="5" stroke-linecap="round"/><path d="M0 0 L-15 8.25 L-15 -8.25 z" fill="#32b466" transform="translate(800 500) rotate(0.0)"/><text x="550" y="484" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="23" font-weight="600" text-anchor="middle">제어창에서 ‘그리기 켜기’ 버튼</text><line x1="800" y1="570" x2="300" y2="570" stroke="#8faabd" stroke-width="5" stroke-linecap="round"/><path d="M0 0 L-15 8.25 L-15 -8.25 z" fill="#8faabd" transform="translate(300 570) rotate(180.0)"/><text x="550" y="609" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="23" font-weight="600" text-anchor="middle">제어창에서 ‘그리기 끄기’ 버튼</text><text x="550" y="671" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="400" text-anchor="middle">꺼진 뒤 다시 켜면 다음 첫 점은 새 별자리를 시작합니다.</text>
</svg>
