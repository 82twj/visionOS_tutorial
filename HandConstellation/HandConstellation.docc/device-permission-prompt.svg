<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">손 추적 권한 창 안내</title><desc id="d">실제 기기 캡처를 기다리는 자리 표시와 권한을 허용했을 때와 거부했을 때의 결과 비교</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263654"/><stop offset="1" stop-color="#0e111c"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#8adfff" stop-opacity=".07"/></linearGradient><marker id="head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#42c8ff"/></marker><marker id="headw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8faabd"/></marker></defs>
  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">실제 기기의 손 추적 권한 창</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">앱을 처음 실행할 때 한 번 나타납니다</text><rect x="854" y="46" width="190" height="40" rx="20" fill="none" stroke="#ff6a3d" stroke-width="2" stroke-dasharray="8 6"/><text x="949" y="73" fill="#ff6a3d" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="600" text-anchor="middle">실제 캡처 대기</text><rect x="140" y="176" width="500" height="400" rx="28" fill="#0e1524" stroke="#ff6a3d" stroke-width="3" stroke-dasharray="12 9"/><text x="390" y="300" fill="#ff6a3d" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="26" font-weight="650" text-anchor="middle">실제 기기 캡처 자리</text><text x="390" y="350" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="middle">시스템 권한 창은 흉내 내지 않습니다.</text><text x="390" y="388" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="middle">Apple Vision Pro에서 직접 캡처한</text><text x="390" y="426" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="middle">이미지로 교체할 예정입니다.</text><rect x="688" y="176" width="356" height="190" rx="22" fill="#111726" stroke="#32b466" stroke-width="2"/><rect x="688" y="176" width="6" height="190" rx="3" fill="#32b466"/><text x="714" y="220" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="25" font-weight="650" text-anchor="start">허용하면</text><text x="714" y="260" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">trackingStatus 가 tracking</text><text x="714" y="292" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">커서와 점이 동작합니다.</text><rect x="688" y="386" width="356" height="190" rx="22" fill="#111726" stroke="#ff6a3d" stroke-width="2"/><rect x="688" y="386" width="6" height="190" rx="3" fill="#ff6a3d"/><text x="714" y="430" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="25" font-weight="650" text-anchor="start">허용하지 않으면</text><text x="714" y="470" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">trackingStatus 가 denied</text><text x="714" y="502" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">창에 안내가 표시됩니다.</text><rect x="56" y="606" width="988" height="62" rx="16" fill="#131b2b" stroke="#3a4a63" stroke-width="2"/><text x="88" y="644" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">권한 창에는 Info에 입력한 설명 문장이 그대로 나타납니다.</text>
</svg>
