<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">시작하기 전에</title><desc id="d">필요한 사전 지식, 과정에서 설명하는 개념, 확인 환경, Simulator 제한을 정리한 표</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263654"/><stop offset="1" stop-color="#0e111c"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#8adfff" stop-opacity=".07"/></linearGradient><marker id="head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#42c8ff"/></marker><marker id="headw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8faabd"/></marker></defs>
  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">이 과정을 시작하기 전에</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">필요한 사전 지식과 확인 환경</text><rect x="56" y="160" width="320" height="300" rx="22" fill="#111726" stroke="#32b466" stroke-width="2"/><rect x="56" y="160" width="6" height="300" rx="3" fill="#32b466"/><text x="82" y="204" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="25" font-weight="650" text-anchor="start">이미 알고 있어야 함</text><text x="82" y="244" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">Swift 문법과 옵셔널</text><text x="82" y="276" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">struct와 class의 차이</text><text x="82" y="308" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">SwiftUI View와 상태</text><text x="82" y="340" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">Xcode 프로젝트 만들기</text><rect x="392" y="160" width="320" height="300" rx="22" fill="#111726" stroke="#42c8ff" stroke-width="2"/><rect x="392" y="160" width="6" height="300" rx="3" fill="#42c8ff"/><text x="418" y="204" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="25" font-weight="650" text-anchor="start">이 과정에서 설명함</text><text x="418" y="244" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">ARKit 손 추적</text><text x="418" y="276" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">RealityKit 엔티티</text><text x="418" y="308" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">simd 좌표 변환</text><text x="418" y="340" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">체류 판정 상태 머신</text><rect x="728" y="160" width="316" height="300" rx="22" fill="#111726" stroke="#ffd14a" stroke-width="2"/><rect x="728" y="160" width="6" height="300" rx="3" fill="#ffd14a"/><text x="754" y="204" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="25" font-weight="650" text-anchor="start">확인 환경</text><text x="754" y="244" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">Xcode 16 이상</text><text x="754" y="276" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">visionOS 2.0 이상 SDK</text><text x="754" y="308" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">Simulator: 창 UI 확인</text><text x="754" y="340" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">실기기: 손 추적 검증</text><rect x="56" y="500" width="988" height="160" rx="22" fill="#131b2b" stroke="#ff6a3d" stroke-width="2"/><text x="88" y="552" fill="#ff6a3d" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="650" text-anchor="start">Simulator에서 확인할 수 없는 것</text><text x="88" y="594" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">ARKit 손 추적은 Apple Vision Pro에서만 동작합니다. Simulator에서는 제어 창과</text><text x="88" y="626" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">몰입형 공간 열기까지 확인하고, 점과 선 생성은 Chapter 7에서 실기기로 검증합니다.</text>
</svg>
