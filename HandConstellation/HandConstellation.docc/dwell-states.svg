<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">머무르기 판정 상태 머신</title><desc id="d">idle, dwelling, coolingDown 세 상태와 상태를 바꾸는 조건을 화살표로 이은 그림. 검지 위치를 잃으면 dwelling과 coolingDown 모두 idle로 돌아갑니다</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263654"/><stop offset="1" stop-color="#0e111c"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#8adfff" stop-opacity=".07"/></linearGradient><marker id="head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#42c8ff"/></marker><marker id="headw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8faabd"/></marker></defs>
  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">머무르기 판정 상태 머신</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">DwellDetector.State</text><circle cx="150" cy="340" r="88" fill="#131b2b" stroke="#8faabd" stroke-width="4"/><text x="150" y="348" fill="#8faabd" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="22" font-weight="650" text-anchor="middle">idle</text><circle cx="520" cy="340" r="88" fill="#131b2b" stroke="#42c8ff" stroke-width="4"/><text x="520" y="348" fill="#42c8ff" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="22" font-weight="650" text-anchor="middle">dwelling</text><circle cx="880" cy="340" r="88" fill="#131b2b" stroke="#ffd14a" stroke-width="4"/><text x="880" y="348" fill="#ffd14a" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="22" font-weight="650" text-anchor="middle">coolingDown</text><line x1="242" y1="340" x2="426" y2="340" stroke="#42c8ff" stroke-width="5" stroke-linecap="round"/><path d="M0 0 L-15 8.25 L-15 -8.25 z" fill="#42c8ff" transform="translate(426 340) rotate(0.0)"/><text x="334" y="308" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="middle">위치가 들어옴</text><line x1="612" y1="340" x2="786" y2="340" stroke="#42c8ff" stroke-width="5" stroke-linecap="round"/><path d="M0 0 L-15 8.25 L-15 -8.25 z" fill="#42c8ff" transform="translate(786 340) rotate(0.0)"/><text x="699" y="308" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="middle">0.8초 유지</text><path d="M474 266 C 510 196, 596 204, 600 290" fill="none" stroke="#42c8ff" stroke-width="5" stroke-linecap="round"/><path d="M0 0 L-15 8.25 L-15 -8.25 z" fill="#42c8ff" transform="translate(600 290) rotate(87)"/><text x="618" y="236" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="start">1.5cm 벗어나면</text><text x="618" y="260" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="start">타이머 재시작</text><path d="M880 430 C 840 540, 580 540, 522 432" fill="none" stroke="#42c8ff" stroke-width="5" stroke-linecap="round"/><path d="M0 0 L-15 8.25 L-15 -8.25 z" fill="#42c8ff" transform="translate(522 432) rotate(-119)"/><text x="700" y="548" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="middle">3cm 이상 이동</text><path d="M470 418 C 380 510, 240 490, 178 414" fill="none" stroke="#8faabd" stroke-width="4" stroke-linecap="round"/><path d="M0 0 L-13 7.15 L-13 -7.15 z" fill="#8faabd" transform="translate(178 414) rotate(-131)"/><text x="324" y="514" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="middle">검지 위치를 잃으면</text><path d="M848 258 C 770 104, 262 104, 184 258" fill="none" stroke="#8faabd" stroke-width="4" stroke-linecap="round"/><path d="M0 0 L-13 7.15 L-13 -7.15 z" fill="#8faabd" transform="translate(184 258) rotate(117)"/><text x="516" y="132" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="middle">검지 위치를 잃으면</text><rect x="56" y="580" width="988" height="86" rx="18" fill="#131b2b" stroke="#3a4a63" stroke-width="2"/><text x="88" y="614" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">점은 dwelling에서 coolingDown으로 넘어가는 그 순간에만 찍힙니다.</text><text x="88" y="646" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">coolingDown 덕분에 같은 자리에서 점이 여러 번 찍히지 않습니다.</text>
</svg>
