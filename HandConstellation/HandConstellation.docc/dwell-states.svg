<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">체류 판정 상태 머신</title><desc id="d">idle, dwelling, coolingDown 세 상태와 상태를 바꾸는 조건을 화살표로 이은 그림</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263654"/><stop offset="1" stop-color="#0e111c"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#8adfff" stop-opacity=".07"/></linearGradient><marker id="head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#42c8ff"/></marker><marker id="headw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8faabd"/></marker></defs>
  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">체류 판정 상태 머신</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">DwellDetector.State</text><circle cx="150" cy="320" r="92" fill="#131b2b" stroke="#8faabd" stroke-width="4"/><text x="150" y="328" fill="#8faabd" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="22" font-weight="650" text-anchor="middle">idle</text><circle cx="520" cy="320" r="92" fill="#131b2b" stroke="#42c8ff" stroke-width="4"/><text x="520" y="328" fill="#42c8ff" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="22" font-weight="650" text-anchor="middle">dwelling</text><circle cx="880" cy="320" r="92" fill="#131b2b" stroke="#ffd14a" stroke-width="4"/><text x="880" y="328" fill="#ffd14a" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="22" font-weight="650" text-anchor="middle">coolingDown</text><line x1="246" y1="320" x2="422" y2="320" stroke="#42c8ff" stroke-width="5" stroke-linecap="round"/><path d="M0 0 L-15 8.25 L-15 -8.25 z" fill="#42c8ff" transform="translate(422 320) rotate(0.0)"/><text x="334" y="288" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="middle">위치가 들어옴</text><line x1="616" y1="320" x2="782" y2="320" stroke="#42c8ff" stroke-width="5" stroke-linecap="round"/><path d="M0 0 L-15 8.25 L-15 -8.25 z" fill="#42c8ff" transform="translate(782 320) rotate(0.0)"/><text x="699" y="288" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="middle">0.8초 유지</text><path d="M880 412 C 840 520, 580 520, 522 416" fill="none" stroke="#42c8ff" stroke-width="5" stroke-linecap="round"/><path d="M0 0 L-15 8.25 L-15 -8.25 z" fill="#42c8ff" transform="translate(522 416) rotate(-119)"/><text x="700" y="528" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="middle">3cm 이상 이동</text><path d="M470 236 C 520 168, 600 178, 604 258" fill="none" stroke="#42c8ff" stroke-width="5" stroke-linecap="round"/><path d="M0 0 L-15 8.25 L-15 -8.25 z" fill="#42c8ff" transform="translate(604 258) rotate(87)"/><text x="548" y="158" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="middle">1.5cm 벗어나면 타이머 재시작</text><path d="M470 402 C 380 490, 240 470, 176 396" fill="none" stroke="#8faabd" stroke-width="4" stroke-linecap="round"/><path d="M0 0 L-13 7.15 L-13 -7.15 z" fill="#8faabd" transform="translate(176 396) rotate(-131)"/><text x="324" y="494" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="middle">추적 손실</text><rect x="56" y="566" width="988" height="96" rx="18" fill="#131b2b" stroke="#3a4a63" stroke-width="2"/><text x="88" y="606" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">점은 dwelling 에서 coolingDown 으로 넘어가는 그 한 프레임에만 확정됩니다.</text><text x="88" y="640" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">coolingDown 이 있어서 같은 위치에서 점이 반복되지 않습니다.</text>
</svg>
