<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">머무르기 진행</title><desc id="d">1.5cm 흔들림 허용 범위 안에서 반투명 흰 커서가 0초, 0.4초, 0.6초로 갈수록 커지고 0.8초에 흰 점이 찍히는 네 단계</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263654"/><stop offset="1" stop-color="#0e111c"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#8adfff" stop-opacity=".07"/></linearGradient><marker id="head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#42c8ff"/></marker><marker id="headw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8faabd"/></marker></defs>
  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">흔들림 허용 범위 1.5cm 안에서 머무르기</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">개념도 · 머무르는 동안 커서가 커지고, 0.8초가 되면 그 자리에 흰 점이 찍힙니다</text><path d="M140 370h820" stroke="#ffffff" stroke-opacity=".13" stroke-width="3"/><circle cx="170" cy="370" r="90" fill="none" stroke="#42c8ff" stroke-width="2.5" stroke-dasharray="6 8" opacity=".55"/><circle cx="170.0" cy="370.0" r="30.6" fill="#ffffff" opacity=".10"/><circle cx="170.0" cy="370.0" r="21.6" fill="#ffffff" opacity="0.72"/><text x="170" y="505" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="600" text-anchor="middle">0.0초</text><text x="170" y="535" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="400" text-anchor="middle">진행률 0</text><text x="170" y="563" fill="#42c8ff" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="650" text-anchor="middle">머무르기 시작</text><circle cx="420" cy="370" r="90" fill="none" stroke="#42c8ff" stroke-width="2.5" stroke-dasharray="6 8" opacity=".55"/><circle cx="420.0" cy="370.0" r="41.1" fill="#ffffff" opacity=".10"/><circle cx="420.0" cy="370.0" r="32.1" fill="#ffffff" opacity="0.72"/><circle cx="420" cy="370" r="50.1" fill="none" stroke="#ffffff" stroke-width="6" opacity=".14"/><path d="M420.0 319.9 A50.1 50.1 0 0 1 420.0 420.1" fill="none" stroke="#8edfff" stroke-width="6" stroke-linecap="round"/><text x="420" y="505" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="600" text-anchor="middle">0.4초</text><text x="420" y="535" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="400" text-anchor="middle">진행률 0.5</text><circle cx="680" cy="370" r="90" fill="none" stroke="#42c8ff" stroke-width="2.5" stroke-dasharray="6 8" opacity=".55"/><circle cx="680.0" cy="370.0" r="46.3" fill="#ffffff" opacity=".10"/><circle cx="680.0" cy="370.0" r="37.3" fill="#ffffff" opacity="0.72"/><circle cx="680" cy="370" r="55.3" fill="none" stroke="#ffffff" stroke-width="6" opacity=".14"/><path d="M680.0 314.7 A55.3 55.3 0 1 1 624.7 370.0" fill="none" stroke="#8edfff" stroke-width="6" stroke-linecap="round"/><text x="680" y="505" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="600" text-anchor="middle">0.6초</text><text x="680" y="535" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="400" text-anchor="middle">진행률 0.75</text><circle cx="930.0" cy="370.0" r="50" fill="#ffffff" opacity=".07"/><circle cx="930.0" cy="370.0" r="43" fill="#ffffff" opacity=".13"/><circle cx="930.0" cy="370.0" r="36" fill="#f5f7fa" stroke="#ffffff" stroke-width="5" opacity="1.00"/><circle cx="930" cy="370" r="58" fill="none" stroke="#ffffff" stroke-width="3" opacity=".35"/><text x="930" y="505" fill="#ffd14a" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="600" text-anchor="middle">0.8초</text><text x="930" y="535" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="400" text-anchor="middle">진행률 1</text><text x="930" y="563" fill="#ffd14a" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="650" text-anchor="middle">점 찍힘</text><text x="240" y="300" fill="#42c8ff" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="650" text-anchor="start">1.5cm</text><rect x=