<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">Dwell gesture progress</title><desc id="d">Four stages show the fingertip cursor growing until a point is committed after 0.8 seconds.</desc>
  <defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#223756"/><stop offset="1" stop-color="#0c1019"/></linearGradient><filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1100" height="720" rx="44" fill="url(#b)"/>
  <path d="M140 370h820" stroke="#fff" stroke-opacity=".13" stroke-width="3"/><g font-family="-apple-system,sans-serif" text-anchor="middle"><g transform="translate(170 360)"><circle r="34" fill="#ff6a3d" opacity=".55"/><circle r="17" fill="#ff8b65"/><text y="105" fill="#b9cbd8" font-size="21">0.0초</text><text y="140" fill="#7f97a9" font-size="17">후보 시작</text></g><g transform="translate(420 360)"><circle r="48" fill="#ff6a3d" opacity=".42"/><circle r="22" fill="#ff8b65"/><path d="M0-62a62 62 0 0 1 54 31" fill="none" stroke="#8edfff" stroke-width="9" stroke-linecap="round"/><text y="105" fill="#b9cbd8" font-size="21">0.3초</text><text y="140" fill="#7f97a9" font-size="17">38%</text></g><g transform="translate(680 360)"><circle r="61" fill="#ff6a3d" opacity=".34"/><circle r="28" fill="#ff8b65"/><path d="M0-78a78 78 0 1 1-72 48" fill="none" stroke="#8edfff" stroke-width="9" stroke-linecap="round"/><text y="105" fill="#b9cbd8" font-size="21">0.6초</text><text y="140" fill="#7f97a9" font-size="17">75%</text></g><g transform="translate(930 360)"><circle r="72" fill="#ffd14a" opacity=".18" filter="url(#g)"/><circle r="29" fill="#ffd14a" stroke="#fff1a8" stroke-width="7" filter="url(#g)"/><text y="105" fill="#fff0a5" font-size="21">0.8초</text><text y="140" fill="#c9aa4b" font-size="17">점 확정</text></g></g>
  <text x="550" y="120" text-anchor="middle" fill="#eef8ff" font-family="-apple-system,sans-serif" font-size="30" font-weight="700">안정 반경 1.5cm 안에서 머무르기</text>
