<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">손 추적 권한 창</title><desc id="d">몰입형 공간을 처음 열 때 나오는 손 추적 권한 창을 일반적인 대화상자로 그린 개념도. 앱 이름 HandConstellation, 사용 목적 문장, 허용 안 함과 허용 버튼, 각 버튼을 눌렀을 때 제어창의 상태(확인 필요, 추적 중)</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263654"/><stop offset="1" stop-color="#0e111c"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#8adfff" stop-opacity=".07"/></linearGradient><marker id="head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#42c8ff"/></marker><marker id="headw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8faabd"/></marker></defs>
  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">처음 공간을 열 때 나오는 손 추적 권한 창</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">개념도 · 실제 권한 창의 모양은 visionOS 버전에 따라 다릅니다</text><g fill="#9be4ff" opacity=".35"><circle cx="820" cy="170" r="2"/><circle cx="980" cy="150" r="3"/><circle cx="1010" cy="520" r="2"/><circle cx="92" cy="560" r="3"/><circle cx="120" cy="230" r="2"/></g><path d="M96 676C320 712 780 712 1004 668" fill="none" stroke="#8adfff" stroke-opacity=".15" stroke-width="2"/><rect x="156" y="164" width="580" height="380" rx="40" fill="#000000" opacity="0.25"/><rect x="150" y="150" width="580" height="380" rx="40" fill="#1a2438" opacity="0.55"/><rect x="150" y="150" width="580" height="380" rx="40" fill="url(#glass)" stroke="#d8f5ff" stroke-opacity=".35" stroke-width="2"/><rect x="406.0" y="176" width="68" height="68" rx="16" fill="#16233a" stroke="#d8f5ff" stroke-width="1.5"/><path d="M422.0 226 L434.0 196 L454.0 212 L458.0 232" fill="none" stroke="#ffffff" stroke-width="2" opacity=".9"/><circle cx="422.0" cy="226" r="4.5" fill="#ffffff"/><circle cx="434.0" cy="196" r="4.5" fill="#ffffff"/><circle cx="454.0" cy="212" r="4.5" fill="#ffffff"/><circle cx="458.0" cy="232" r="4.5" fill="#ffffff"/><text x="440.0" y="292" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" text-anchor="middle">HandConstellation</text><text x="440.0" y="324" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="600" text-anchor="middle">손 추적 권한 요청</text><text x="440.0" y="378" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="middle">검지 끝의 움직임을 감지해 공중에 별자리 점과 선을</text><text x="440.0" y="408" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="middle">그리기 위해 손 추적을 사용합니다.</text><rect x="178" y="446" width="250" height="56" rx="28" fill="#ffffff" opacity="0.14"/><text x="303" y="482" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="600" text-anchor="middle">허용 안 함</text><rect x="452" y="446" width="250" height="56" rx="28" fill="#ffffff" opacity="0.14"/><text x="577" y="482" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="700" text-anchor="middle">허용</text><rect x="446" y="440" width="262" height="68" rx="34" fill="none" stroke="#42c8ff" stroke-width="3"/><line x1="303" y1="540" x2="303" y2="566" stroke="#8faabd" stroke-width="3" stroke-linecap="round"/><path d="M0 0 L-15 8.25 L-15 -8.25 z" fill="#8faabd" transform="translate(303 566) rotate(90.0)"/><rect x="246.46" y="574" width="113.08" height="40" rx="20" fill="#131b2b" stroke="#ff6a3d" stroke-width="2"/><text x="303" y="600" fill="#ff6a3d" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="650" text-anchor="middle">확인 필요</text><text x="303" y="646" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="400" text-anchor="middle">설정에서 다시 허용해야 그릴 수 있습니다</text><line x1="577" y1="540" x2="577" y2="566" stroke="#8faabd" stroke-width="3" stroke-linecap="round"/><path d="M0 0 L-15 8.25 L-15 -8.25 z" fill="#8faabd" transform="translate(577 566) rotate(90.0)"/><rect x="528.92" y="574" width="96.16" height="40" rx="20" fill="#131b2b" stroke="#32b466" stroke-width="2"/><text x="577" y="600" fill="#32b466" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="650" text-anchor="middle">추적 중</text><text x="577" y="646" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="400" text-anchor="middle">그리기 켜기 버튼을 누를 수 있습니다</text><line x1="776" y1="391" x2="730" y2="391" stroke="#8faabd" stroke-width="2"/><circle cx="730" cy="391" r="4" fill="#8faabd"/><text x="784" y="372" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="start">Chapter 1에서 Info 탭에</text><text x="784" y="400" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="start">적은 사용 목적 문장이</text><text x="784" y="428" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="start">그대로 나옵니다.</text>
</svg>
