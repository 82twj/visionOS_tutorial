<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">스타터 프로젝트 파일 지도</title><desc id="d">스타터 프로젝트의 파일을 완성본 제공, 일부 제공, 직접 작성으로 나누고 각 파일을 작성하는 Chapter를 표시한 지도</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263654"/><stop offset="1" stop-color="#0e111c"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#8adfff" stop-opacity=".07"/></linearGradient><marker id="head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#42c8ff"/></marker><marker id="headw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8faabd"/></marker></defs>
  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">스타터 프로젝트 파일 지도</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">개념도 · 들어 있는 파일과 직접 작성하는 Chapter (동그라미 숫자)</text><rect x="56" y="148" width="352" height="402" rx="22" fill="#111726" stroke="#32b466" stroke-width="2"/><rect x="56" y="148" width="6" height="402" rx="3" fill="#32b466"/><text x="82" y="190" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="650" text-anchor="start">완성본 제공</text><text x="82" y="216" fill="#32b466" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" text-anchor="start">읽어 보고 그대로 씁니다</text><rect x="74" y="232" width="316" height="52" rx="12" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="90" y="255" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">AppModel</text><text x="90" y="275" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">앱 상태 · 그리기 켜기/끄기</text><rect x="74" y="294" width="316" height="52" rx="12" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="90" y="317" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">ControlView</text><text x="90" y="337" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">제어창 화면과 버튼</text><rect x="74" y="356" width="316" height="52" rx="12" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="90" y="379" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">ConstellationConfiguration</text><text x="90" y="399" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">0.8초 · 3cm 같은 조절값</text><rect x="74" y="418" width="316" height="52" rx="12" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="90" y="441" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">ConstellationModel</text><text x="90" y="461" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">점과 선을 저장하는 그래프</text><rect x="74" y="480" width="316" height="52" rx="12" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="90" y="503" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">ExistingPointConnectionDetector</text><text x="90" y="523" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">기존 점에 다시 연결</text><rect x="424" y="148" width="300" height="402" rx="22" fill="#111726" stroke="#ffd14a" stroke-width="2"/><rect x="424" y="148" width="6" height="402" rx="3" fill="#ffd14a"/><text x="450" y="190" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="650" text-anchor="start">일부 제공</text><text x="450" y="216" fill="#ffd14a" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" text-anchor="start">빈 곳만 채웁니다</text><rect x="442" y="232" width="264" height="52" rx="12" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="458" y="255" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">DwellDetector</text><text x="458" y="275" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">update(…)만 비어 있음</text><circle cx="680" cy="258" r="15" fill="#f5f7fa"/><text x="680" y="264" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">3</text><rect x="442" y="294" width="264" height="52" rx="12" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="458" y="317" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">HandConstellationApp</text><text x="458" y="337" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">WindowGroup만 있음</text><circle cx="680" cy="320" r="15" fill="#f5f7fa"/><text x="680" y="326" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">4</text><rect x="442" y="356" width="264" height="52" rx="12" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="458" y="379" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">Info</text><text x="458" y="399" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">손 추적 권한 설명 없음</text><circle cx="680" cy="382" r="15" fill="#f5f7fa"/><text x="680" y="388" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">1</text><rect x="740" y="148" width="304" height="402" rx="22" fill="#111726" stroke="#42c8ff" stroke-width="2"/><rect x="740" y="148" width="6" height="402" rx="3" fill="#42c8ff"/><text x="766" y="190" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="650" text-anchor="start">직접 작성</text><text x="766" y="216" fill="#42c8ff" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" text-anchor="start">import Foundation만 있는 빈 파일</text><rect x="758" y="232" width="268" height="52" rx="12" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="774" y="255" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">HandTrackingService</text><text x="774" y="275" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">손 추적 · 검지 끝 좌표</text><circle cx="1000" cy="258" r="15" fill="#f5f7fa"/><text x="1000" y="264" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">2</text><rect x="758" y="294" width="268" height="52" rx="12" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="774" y="317" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">ConstellationRenderer</text><text x="774" y="337" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">점과 선 엔티티</text><circle cx="1000" cy="320" r="15" fill="#f5f7fa"/><text x="1000" y="326" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">3</text><rect x="758" y="356" width="268" height="52" rx="12" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="774" y="379" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">ImmersiveCoordinator</text><text x="774" y="399" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">손 입력과 장면 연결</text><circle cx="1000" cy="382" r="15" fill="#f5f7fa"/><text x="1000" y="388" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">4</text><rect x="758" y="418" width="268" height="52" rx="12" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="774" y="441" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">ImmersiveView</text><text x="774" y="461" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">RealityView</text><circle cx="1000" cy="444" r="15" fill="#f5f7fa"/><text x="1000" y="450" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">4</text><text x="442" y="458" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" text-anchor="start">DwellDetector에는 update(…)를 뺀</text><text x="442" y="480" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" text-anchor="start">타입·속성·보조 메서드가 다 있습니다.</text><text x="758" y="508" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" text-anchor="start">빈 파일이어도 스타터는 그대로</text><text x="758" y="530" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" text-anchor="start">빌드되고 제어창이 열립니다.</text><rect x="56" y="566" width="988" height="110" rx="20" fill="#131b2b" stroke="#3a4a63" stroke-width="2"/><text x="80" y="598" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="650" text-anchor="start">Chapter별로 직접 쓰는 곳</text><text x="1020" y="598" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="400" text-anchor="end">Chapter 1–4는 Simulator로 확인합니다</text><rect x="80" y="614" width="178" height="48" rx="24" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><circle cx="104" cy="638" r="15" fill="#f5f7fa"/><text x="104" y="644" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">1</text><text x="128" y="644" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" text-anchor="start">권한 설명</text><rect x="270" y="614" width="178" height="48" rx="24" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><circle cx="294" cy="638" r="15" fill="#f5f7fa"/><text x="294" y="644" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">2</text><text x="318" y="644" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" text-anchor="start">손 추적</text><rect x="460" y="614" width="178" height="48" rx="24" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><circle cx="484" cy="638" r="15" fill="#f5f7fa"/><text x="484" y="644" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">3</text><text x="508" y="644" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" text-anchor="start">머무르기 · 렌더러</text><rect x="650" y="614" width="178" height="48" rx="24" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><circle cx="674" cy="638" r="15" fill="#f5f7fa"/><text x="674" y="644" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">4</text><text x="698" y="644" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" text-anchor="start">코디네이터 · 공간</text><rect x="840" y="614" width="178" height="48" rx="24" fill="#0e1524" stroke="#ff6a3d" stroke-width="2"/><circle cx="864" cy="638" r="15" fill="#ff6a3d"/><text x="864" y="644" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">5</text><text x="888" y="644" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" text-anchor="start">Vision Pro 실행</text>
