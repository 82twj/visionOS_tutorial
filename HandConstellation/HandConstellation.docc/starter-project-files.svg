,'Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" text-anchor="start">코디네이터 · 공간</text><rect x="840" y="620" width="178" height="48" rx="24" fill="#0e1524" stroke="#ff6a3d" stroke-width="2"/><circle cx="864" cy="644" r="15" fill="#ff6a3d"/><text x="864" y="650" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">5</text><text x="888" y="650" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" text-anchor="start">Vision Pro 실행</text>
