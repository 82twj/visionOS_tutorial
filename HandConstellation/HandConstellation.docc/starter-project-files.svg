<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">스타터 프로젝트 파일 지도</title><desc id="d">스타터 프로젝트의 파일을 완성본 제공(AppModel, ConstellationConfiguration, ConstellationModel, ExistingPointConnectionDetector, SimulatorInputPad), 일부 제공(Info, DwellDetector, ConstellationRenderer, ImmersiveCoordinator, ControlView, HandConstellationApp), 빈 파일(HandTrackingService, ImmersiveView), 테스트(DwellDetectorTests)로 나누고 각 파일을 작성하는 Chapter를 표시한 지도</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263654"/><stop offset="1" stop-color="#0e111c"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#8adfff" stop-opacity=".07"/></linearGradient><marker id="head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#42c8ff"/></marker><marker id="headw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8faabd"/></marker></defs>
  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">스타터 프로젝트 파일 지도</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">개념도 · 들어 있는 파일과 직접 작성하는 Chapter (동그라미 숫자)</text><rect x="56" y="140" width="320" height="420" rx="22" fill="#111726" stroke="#32b466" stroke-width="2"/><rect x="56" y="140" width="6" height="420" rx="3" fill="#32b466"/><text x="80" y="180" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="650" text-anchor="start">완성본 제공</text><text x="80" y="204" fill="#32b466" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="600" text-anchor="start">읽어 보고 그대로 씁니다</text><rect x="72" y="218" width="288" height="50" rx="12" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="88" y="240" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">AppModel</text><text x="88" y="259" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">앱 상태 · 그리기 시작/멈춤</text><rect x="72" y="274" width="288" height="50" rx="12" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="88" y="296" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">ConstellationConfiguration</text><text x="88" y="315" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">0.8초 · 3cm 같은 조절값</text><rect x="72" y="330" width="288" height="50" rx="12" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="88" y="352" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">ConstellationModel</text><text x="88" y="371" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">점과 선을 저장하는 그래프</text><rect x="72" y="386" width="288" height="50" rx="12" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="88" y="408" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">ExistingPointConnectionDetector</text><text x="88" y="427" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">기존 점에 다시 연결</text><rect x="72" y="442" width="288" height="50" rx="12" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="88" y="464" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">SimulatorInputPad</text><text x="88" y="483" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">Simulator 입력 패드</text><text x="80" y="524" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" text-anchor="start">SimulatorInputPad는 Simulator</text><text x="80" y="546" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" text-anchor="start">빌드에만 들어갑니다.</text><rect x="392" y="140" width="360" height="420" rx="22" fill="#111726" stroke="#ffd14a" stroke-width="2"/><rect x="392" y="140" width="6" height="420" rx="3" fill="#ffd14a"/><text x="416" y="180" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="650" text-anchor="start">일부 제공</text><text x="416" y="204" fill="#ffd14a" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="600" text-anchor="start">빈 곳만 채웁니다</text><rect x="408" y="218" width="328" height="50" rx="12" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="424" y="240" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">Info</text><text x="424" y="259" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">손 추적 권한 설명 없음</text><circle cx="712" cy="243" r="15" fill="#f5f7fa"/><text x="712" y="249" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">1</text><rect x="408" y="274" width="328" height="50" rx="12" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="424" y="296" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">DwellDetector</text><text x="424" y="315" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">update(…)만 없음</text><circle cx="712" cy="299" r="15" fill="#f5f7fa"/><text x="712" y="305" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">3</text><rect x="408" y="330" width="328" height="50" rx="12" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="424" y="352" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">ConstellationRenderer</text><text x="424" y="371" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">기존 점 연결 안내만 있음</text><circle cx="712" cy="355" r="15" fill="#f5f7fa"/><text x="712" y="361" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">3</text><rect x="408" y="386" width="328" height="50" rx="12" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="424" y="408" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">ImmersiveCoordinator</text><text x="424" y="427" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">속성·init·보조 메서드만 있음</text><circle cx="712" cy="411" r="15" fill="#f5f7fa"/><text x="712" y="417" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">4</text><rect x="408" y="442" width="328" height="50" rx="12" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="424" y="464" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">ControlView</text><text x="424" y="483" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">toggleImmersiveSpace()만 비어 있음</text><circle cx="712" cy="467" r="15" fill="#f5f7fa"/><text x="712" y="473" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">4</text><rect x="408" y="498" width="328" height="50" rx="12" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="424" y="520" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">HandConstellationApp</text><text x="424" y="539" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">WindowGroup만 있음</text><circle cx="712" cy="523" r="15" fill="#f5f7fa"/><text x="712" y="529" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">4</text><rect x="768" y="140" width="276" height="250" rx="22" fill="#111726" stroke="#42c8ff" stroke-width="2"/><rect x="768" y="140" width="6" height="250" rx="3" fill="#42c8ff"/><text x="792" y="180" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="650" text-anchor="start">빈 파일</text><text x="792" y="204" fill="#42c8ff" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="600" text-anchor="start">import Foundation 한 줄만 있음</text><rect x="784" y="218" width="244" height="50" rx="12" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="800" y="240" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">HandTrackingService</text><text x="800" y="259" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">손 추적 · 검지 끝 좌표</text><circle cx="1004" cy="243" r="15" fill="#f5f7fa"/><text x="1004" y="249" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">2</text><rect x="784" y="274" width="244" height="50" rx="12" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="800" y="296" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">ImmersiveView</text><text x="800" y="315" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">RealityView</text><circle cx="1004" cy="299" r="15" fill="#f5f7fa"/><text x="1004" y="305" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">4</text><text x="792" y="352" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" text-anchor="start">빈 파일이어도 스타터는 그대로</text><text x="792" y="374" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" text-anchor="start">빌드되고 제어창이 열립니다.</text><rect x="768" y="404" width="276" height="156" rx="22" fill="#111726" stroke="#8faabd" stroke-width="2"/><rect x="768" y="404" width="6" height="156" rx="3" fill="#8faabd"/><text x="792" y="444" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="650" text-anchor="start">테스트</text><text x="792" y="468" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="600" text-anchor="start">읽기만 하고 Chapter 3에서 실행</text><rect x="784" y="482" width="244" height="50" rx="12" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="800" y="504" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="600" text-anchor="start">DwellDetectorTests</text><text x="800" y="523" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">머무르기 테스트 6개</text><rect x="56" y="574" width="988" height="106" rx="20" fill="#131b2b" stroke="#3a4a63" stroke-width="2"/><text x="80" y="606" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="650" text-anchor="start">Chapter별로 직접 쓰는 곳</text><text x="1020" y="606" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-s