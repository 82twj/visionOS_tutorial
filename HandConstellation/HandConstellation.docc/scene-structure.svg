<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">제어창과 몰입형 공간</title><desc id="d">WindowGroup으로 띄운 제어창이 openImmersiveSpace로 혼합 몰입형 공간을 열고 dismissImmersiveSpace로 닫는 구조. 공간 안의 RealityView와 ARKit은 같은 원점을 쓰고, 두 장면은 같은 AppModel을 봅니다. 공간 안의 점, 선, 커서는 흰색입니다.</desc>
