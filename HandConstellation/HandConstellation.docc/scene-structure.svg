  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <rect x="56" y="105" width="370" height="455" rx="34" fill="#1a2438" opacity="0.55"/><rect x="56" y="105" width="370" height="455" rx="34" fill="url(#glass)" stroke="#d8f5ff" stroke-opacity=".35" stroke-width="2"/><path d="M104 139 Q106 151 118 153 Q106 155 104 167 Q102 155 90 153 Q102 151 104 139 Z" fill="#f5f7fa"/><text x="132" y="162" fill="#ffffff" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="28" font-weight="700" text-anchor="start">Hand Constellation</text><text x="92" y="220" fill="#bcd0df" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">체험을 시작할 준비가 되었습니다.</text><rect x="90" y="253" width="302" height="62" rx="18" fill="#1677ff"/><text x="241" y="293" fill="#ffffff" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="650" text-anchor="middle">별자리 그리기 시작</text><rect x="90" y="335" width="145" height="58" rx="17" fill="#32b466" opacity="0.4"/><text x="162.5" y="372" fill="#ffffff" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="650" text-anchor="middle" opacity="0.6">그리기 시작</text><rect x="251" y="335" width="141" height="58" rx="17" fill="#ffffff" opacity="0.08"/><text x="321.5" y="372" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="middle" opacity="0.6">초기화</text><text x="92" y="520" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="start">WindowGroup · 제어창</text><text x="533" y="262" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="400" text-anchor="middle">별자리 그리기 시작</text><text x="533" y="286" fill="#42c8ff" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="15" font-weight="600" text-anchor="middle">openImmersiveSpace</text><line x1="446" y1="300" x2="616" y2="300" stroke="#42c8ff" stroke-width="5" stroke-linecap="round"/><path d="M0 0 L-15 8.25 L-15 -8.25 z" fill="#42c8ff" transform="translate(616 300) rotate(0.0)"/><line x1="616" y1="372" x2="446" y2="372" stroke="#8faabd" stroke-width="4" stroke-linecap="round"/><path d="M0 0 L-15 8.25 L-15 -8.25 z" fill="#8faabd" transform="translate(446 372) rotate(180.0)"/><text x="533" y="398" fill="#8faabd" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="15" font-weight="600" text-anchor="middle">dismissImmersiveSpace</text><text x="533" y="420" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="400" text-anchor="middle">체험 종료</text><defs><clipPath id="space"><rect x="640" y="74" width="404" height="520" rx="42"/></clipPath></defs><rect x="640" y="74" width="404" height="520" rx="42" fill="#070b15"/><line x1="690.0" y1="405.0" x2="750.0" y2="255.0" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.92"/><line x1="750.0" y1="255.0" x2="905.0" y2="285.0" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.92"/><line x1="905.0" y1="285.0" x2="870.0" y2="410.0" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.92"/><line x1="870.0" y1="410.0" x2="690.0" y2="405.0" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.92"/><line x1="690.0" y1="405.0" x2="905.0" y2="285.0" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.92"/><circle cx="690.0" cy="405.0" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="5" opacity="1.00"/><circle cx="750.0" cy="255.0" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="5" opacity="1.00"/><circle cx="905.0" cy="285.0" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="5" opacity="1.00"/><circle cx="870.0" cy="410.0" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="5" opacity="1.00"/><