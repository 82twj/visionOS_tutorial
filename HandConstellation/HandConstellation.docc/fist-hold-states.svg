<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">주먹 유지 상태 머신</title><desc id="d">ready, holding, waitingForRelease 세 상태와 한 번만 전환되는 경로를 나타낸 그림</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263654"/><stop offset="1" stop-color="#0e111c"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#8adfff" stop-opacity=".07"/></linearGradient><marker id="head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#42c8ff"/></marker><marker id="headw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8faabd"/></marker></defs>
  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">주먹 유지 상태 머신</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">FistHoldDetector.State</text><circle cx="150" cy="310" r="96" fill="#131b2b" stroke="#8faabd" stroke-width="4"/><circle cx="520" cy="310" r="96" fill="#131b2b" stroke="#ff6a3d" stroke-width="4"/><circle cx="880" cy="310" r="96" fill="#131b2b" stroke="#32b466" stroke-width="4"/><text x="150" y="318" fill="#8faabd" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="24" font-weight="650" text-anchor="middle">ready</text><text x="520" y="318" fill="#ff6a3d" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="24" font-weight="650" text-anchor="middle">holding</text><text x="880" y="302" fill="#32b466" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="21" font-weight="650" text-anchor="middle">waitingFor</text><text x="880" y="334" fill="#32b466" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="21" font-weight="650" text-anchor="middle">Release</text><line x1="250" y1="310" x2="418" y2="310" stroke="#42c8ff" stroke-width="5" stroke-linecap="round"/><path d="M0 0 L-15 8.25 L-15 -8.25 z" fill="#42c8ff" transform="translate(418 310) rotate(0.0)"/><text x="334" y="278" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="middle">주먹 감지</text><line x1="620" y1="310" x2="778" y2="310" stroke="#42c8ff" stroke-width="5" stroke-linecap="round"/><path d="M0 0 L-15 8.25 L-15 -8.25 z" fill="#42c8ff" transform="translate(778 310) rotate(0.0)"/><text x="699" y="262" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="middle">0.6초 도달</text><text x="699" y="290" fill="#32b466" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="600" text-anchor="middle">여기서 한 번만 전환</text><path d="M880 406 C 800 528, 300 528, 152 406" fill="none" stroke="#42c8ff" stroke-width="5" stroke-linecap="round"/><path d="M0 0 L-15 8.25 L-15 -8.25 z" fill="#42c8ff" transform="translate(152 406) rotate(-140)"/><text x="516" y="522" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="middle">손을 다시 펴야 재활성화</text><path d="M462 226 C 380 158, 250 172, 172 222" fill="none" stroke="#8faabd" stroke-width="4" stroke-linecap="round"/><path d="M0 0 L-13 7.15 L-13 -7.15 z" fill="#8faabd" transform="translate(172 222) rotate(147)"/><text x="316" y="156" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="middle">주먹이 풀리면</text><rect x="56" y="566" width="988" height="96" rx="18" fill="#131b2b" stroke="#ff6a3d" stroke-width="2"/><text x="88" y="606" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">주먹을 계속 쥐고 있어도 waitingForRelease 에서는 다시 전환하지 않습니다.</text><text x="88" y="640" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">덕분에 한 번의 주먹 유지가 정확히 한 번의 그리기 전환이 됩니다.</text>
</svg>
