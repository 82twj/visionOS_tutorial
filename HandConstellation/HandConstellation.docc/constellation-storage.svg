<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">여러 별자리의 저장 구조</title><desc id="d">constellations 배열의 [0]에 점 4개 · 선 5개, [1]에 점 3개 · 선 3개가 따로 저장되고 두 별자리 사이에는 선이 없음을 보여 주는 그림</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263654"/><stop offset="1" stop-color="#0e111c"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#8adfff" stop-opacity=".07"/></linearGradient><marker id="head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#42c8ff"/></marker><marker id="headw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8faabd"/></marker></defs>
  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">별자리마다 점과 선을 따로 저장하기</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">ConstellationModel.constellations: [Constellation]</text><rect x="56" y="168" width="988" height="300" rx="24" fill="#111726" stroke="#3a4a63" stroke-width="2"/><text x="88" y="214" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="24" font-weight="650" text-anchor="start">constellations</text><text x="1012" y="213" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="end">제어창 표시: 별자리 2개 · 점 7개 · 선 8개</text><rect x="88" y="250" width="924" height="96" rx="18" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="116" y="306" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="22" font-weight="650" text-anchor="start">[0]</text><path d="M210 298 H486" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".85"/><path d="M210 298 Q348 370 486 298" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".85"/><path d="M210 298 Q302 226 394 298" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".85"/><circle cx="210" cy="298" r="18" fill="#f5f7fa"/><text x="210" y="304" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">A</text><circle cx="302" cy="298" r="18" fill="#f5f7fa"/><text x="302" y="304" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">B</text><circle cx="394" cy="298" r="18" fill="#f5f7fa"/><text x="394" y="304" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">C</text><circle cx="486" cy="298" r="18" fill="#f5f7fa"/><text x="486" y="304" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">D</text><text x="650" y="306" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">점 4개 · 선 5개</text><text x="866" y="306" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="650" text-anchor="start">마친 별자리</text><rect x="88" y="366" width="924" height="96" rx="18" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="116" y="422" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="22" font-weight="650" text-anchor="start">[1]</text><path d="M210 414 H394" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".85"/><path d="M210 414 Q302 486 394 414" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".85"/><circle cx="210" cy="414" r="18" fill="#f5f7fa"/><circle cx="302" cy="414" r="18" fill="#f5f7fa"/><circle cx="394" cy="414" r="18" fill="#f5f7fa"/><text x="650" y="422" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">점 3개 · 선 3개</text><text x="866" y="422" fill="#32b466" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="650" text-anchor="start">그리는 중</text><rect x="56" y="500" width="484" height="160" rx="20" fill="#131b2b" stroke="#32b466" stroke-width="2"/><text x="88" y="546" fill="#32b466" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="650" text-anchor="start">선이 생기는 곳</text><text x="88" y="588" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">지금 그리는 Constellation 안의</text><text x="88" y="620" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">서로 다른 두 점만 잇습니다.</text><rect x="560" y="500" width="484" height="160" rx="20" fill="#131b2b" stroke="#ff6a3d" stroke-width="2"/><text x="592" y="546" fill="#ff6a3d" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="650" text-anchor="start">선이 생기지 않는 곳</text><text x="592" y="588" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">[0]의 마지막 점과 [1]의 첫 점</text><text x="592" y="620" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">사이에는 선이 없습니다.</text>
