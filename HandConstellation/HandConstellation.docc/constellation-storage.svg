<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">여러 별자리의 그래프 저장</title><desc id="d">각 Constellation이 ID가 있는 노드와 중복 없는 간선을 가지며 별자리 사이에는 선이 없음을 보여 주는 그림</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263654"/><stop offset="1" stop-color="#0e111c"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#8adfff" stop-opacity=".07"/></linearGradient><marker id="head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#42c8ff"/></marker><marker id="headw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8faabd"/></marker></defs>
  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">노드와 간선으로 별자리 저장하기</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">constellations: [Constellation]</text><rect x="56" y="168" width="988" height="300" rx="24" fill="#111726" stroke="#3a4a63" stroke-width="2"/><text x="88" y="214" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="24" font-weight="650" text-anchor="start">constellations</text><rect x="88" y="250" width="924" height="96" rx="18" fill="#0e1524" stroke="#f5f7fa" stroke-width="2"/><text x="116" y="306" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="22" font-weight="650" text-anchor="start">[0]</text><line x1="210" y1="298" x2="302" y2="298" stroke="#f5f7fa" stroke-width="5" opacity=".6"/><line x1="302" y1="298" x2="394" y2="298" stroke="#f5f7fa" stroke-width="5" opacity=".6"/><line x1="394" y1="298" x2="486" y2="298" stroke="#f5f7fa" stroke-width="5" opacity=".6"/><circle cx="210" cy="298" r="18" fill="#f5f7fa"/><circle cx="302" cy="298" r="18" fill="#f5f7fa"/><circle cx="394" cy="298" r="18" fill="#f5f7fa"/><circle cx="486" cy="298" r="18" fill="#f5f7fa"/><text x="650" y="306" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">노드 4개 · 간선 5개</text><text x="866" y="306" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="650" text-anchor="start">완료</text><rect x="88" y="366" width="924" height="96" rx="18" fill="#0e1524" stroke="#f5f7fa" stroke-width="2"/><text x="116" y="422" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="22" font-weight="650" text-anchor="start">[1]</text><line x1="210" y1="414" x2="302" y2="414" stroke="#f5f7fa" stroke-width="5" opacity=".6"/><line x1="302" y1="414" x2="394" y2="414" stroke="#f5f7fa" stroke-width="5" opacity=".6"/><circle cx="210" cy="414" r="18" fill="#f5f7fa"/><circle cx="302" cy="414" r="18" fill="#f5f7fa"/><circle cx="394" cy="414" r="18" fill="#f5f7fa"/><text x="650" y="422" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">노드 3개 · 간선 2개</text><text x="866" y="422" fill="#32b466" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="650" text-anchor="start">현재</text><rect x="56" y="500" width="484" height="160" rx="20" fill="#131b2b" stroke="#32b466" stroke-width="2"/><text x="88" y="546" fill="#32b466" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="650" text-anchor="start">간선이 생기는 곳</text><text x="88" y="588" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">현재 Constellation 안의</text><text x="88" y="620" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">서로 다른 두 노드를 잇습니다.</text><rect x="560" y="500" width="484" height="160" rx="20" fill="#131b2b" stroke="#ff6a3d" stroke-width="2"/><text x="592" y="546" fill="#ff6a3d" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="650" text-anchor="start">선이 생기지 않는 곳</text><text x="592" y="588" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">[0]의 마지막 점과 [1]의 첫 점</text><text x="592" y="620" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">사이에는 선이 없습니다.</text>
</svg>
