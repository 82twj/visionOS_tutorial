  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">여러 별자리를 나누어 저장하기</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">constellations: [[SIMD3&lt;Float&gt;]]</text><rect x="56" y="168" width="988" height="300" rx="24" fill="#111726" stroke="#3a4a63" stroke-width="2"/><text x="88" y="214" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="24" font-weight="650" text-anchor="start">constellations</text><rect x="88" y="250" width="924" height="96" rx="18" fill="#0e1524" stroke="#ffd14a" stroke-width="2"/><text x="116" y="306" fill="#ffd14a" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="22" font-weight="650" text-anchor="start">[0]</text><line x1="210" y1="298" x2="302" y2="298" stroke="#ffd14a" stroke-width="5" opacity=".6"/><line x1="302" y1="298" x2="394" y2="298" stroke="#ffd14a" stroke-width="5" opacity=".6"/><line x1="394" y1="298" x2="486" y2="298" stroke="#ffd14a" stroke-width="5" opacity=".6"/><line x1="486" y1="298" x2="578" y2="298" stroke="#ffd14a" stroke-width="5" opacity=".6"/><circle cx="210" cy="298" r="18" fill="#ffd14a"/><circle cx="302" cy="298" r="18" fill="#ffd14a"/><circle cx="394" cy="298" r="18" fill="#ffd14a"/><circle cx="486" cy="298" r="18" fill="#ffd14a"/><circle cx="578" cy="298" r="18" fill="#ffd14a"/><text x="760" y="306" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">점 5개 · 선 4개</text><rect x="88" y="366" width="924" height="96" rx="18" fill="#0e1524" stroke="#42c8ff" stroke-width="2"/><text x="116" y="422" fill="#42c8ff" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="22" font-weight="650" text-anchor="start">[1]</text><line x1="210" y1="414" x2="302" y2="414" stroke="#42c8ff" stroke-width="5" opacity=".6"/><line x1="302" y1="414" x2="394" y2="414" stroke="#42c8ff" stroke-width="5" opacity=".6"/><line x1="394" y1="414" x2="486" y2="414" stroke="#42c8ff" stroke-width="5" opacity=".6"/><circle cx="210" cy="414" r="18" fill="#42c8ff"/><circle cx="302" cy="414" r="18" fill="#42c8ff"/><circle cx="394" cy="414" r="18" fill="#42c8ff"/><circle cx="486" cy="414" r="18" fill="#42c8ff"/><text x="760" y="422" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">점 4개 · 선 3개</text><rect x="56" y="500" width="484" height="160" rx="20" fill="#131b2b" stroke="#32b466" stroke-width="2"/><text x="88" y="546" fill="#32b466" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="650" text-anchor="start">선이 생기는 곳</text><text x="88" y="588" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">같은 배열 안에서 이전 점이</text><text x="88" y="620" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">있을 때만 선분을 만듭니다.</text><rect x="560" y="500" width="484" height="160" rx="20" fill="#131b2b" stroke="#ff6a3d" stroke-width="2"/><text x="592" y="546" fill="#ff6a3d" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="650" text-anchor="start">선이 생기지 않는 곳</text><text x="592" y="588" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">[0]의 마지막 점과 [1]의 첫 점</text><text x="592" y="620" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">사이에는 선이 없습니다.</text>
