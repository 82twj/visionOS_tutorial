<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">Simulator 입력 패드</title><desc id="d">Simulator 입력 패드에서 왼쪽 위를 기준으로 (0.72, 0.38) 위치를 누르면 몰입형 공간의 0.45m × 0.30m 영역에서 같은 비율 위치에 커서가 나타나는 개념도</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263654"/><stop offset="1" stop-color="#0e111c"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#8adfff" stop-opacity=".07"/></linearGradient><marker id="head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#42c8ff"/></marker><marker id="headw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8faabd"/></marker></defs>
  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">입력 패드에서 누른 위치가 검지 끝 위치가 됩니다</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">개념도 · Simulator 빌드에만 있는 보조 입력</text><rect x="56" y="150" width="360" height="360" rx="28" fill="#1a2438" opacity="0.55"/><rect x="56" y="150" width="360" height="360" rx="28" fill="url(#glass)" stroke="#d8f5ff" stroke-opacity=".35" stroke-width="2"/><path d="M84 178 l0 22 l6 -6 l5 10 l4 -2 l-5 -10 l8 0 z" fill="#f5f7fa"/><text x="112" y="197" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="650" text-anchor="start">Simulator 입력 패드</text><rect x="86" y="224" width="300" height="200" rx="16" fill="#ffffff" opacity="0.08"/><rect x="86" y="224" width="300" height="200" rx="16" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/><text x="96" y="246" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="400" text-anchor="start">(0, 0)</text><text x="376" y="414" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="400" text-anchor="end">(1, 1)</text><circle cx="302.0" cy="300.0" r="7" fill="#ffffff"/><text x="286.0" y="306.0" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="600" text-anchor="end">누른 곳</text><text x="302.0" y="334.0" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="600" text-anchor="middle">(0.72, 0.38)</text><text x="86" y="470" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">실제 패드 360 × 240pt · 제어창 오른쪽에 붙습니다</text><rect x="600" y="150" width="444" height="360" rx="26" fill="#070b15" stroke="#42c8ff" stroke-width="2" opacity="0.65"/><text x="624" y="184" fill="#8edfff" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="600" text-anchor="start">몰입형 공간</text><rect x="672" y="224" width="300" height="200" rx="6" fill="none" stroke="#42c8ff" stroke-width="2.5" stroke-dasharray="8 7"/><text x="822.0" y="212" fill="#42c8ff" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="650" text-anchor="middle">0.45m</text><text x="982" y="330.0" fill="#42c8ff" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="650" text-anchor="start">0.30m</text><text x="682" y="246" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="400" text-anchor="start">(0, 0)</text><text x="962" y="414" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="13" font-weight="400" text-anchor="end">(1, 1)</text><circle cx="888.0" cy="300.0" r="20.0" fill="#ffffff" opacity=".10"/><circle cx="888.0" cy="300.0" r="11.0" fill="#ffffff" opacity="0.72"/><text x="910.0" y="306.0" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="600" text-anchor="start">커서</text><text x="888.0" y="334.0" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="600" text-anchor="middle">(0.72, 0.38)</text><text x="624" y="466" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" text-anchor="start">영역 중심: 원점에서 왼쪽 0.42m · 높이 1.55m · 앞 0.70m</text><text x="624" y="490" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" text-anchor="start">Simulator 화면에서는 제어창 왼쪽에 보입니다</text><line x1="314.0" y1="300.0" x2="862.0" y2="300.0" stroke="#42c8ff" stroke-width="3" stroke-dasharray="9 7"/><path d="M0 0 L-13 7.15 L-13 -7.15 z" fill="#42c8ff" transform="translate(868.0 300.0) rotate(0)"/><rect x="444" y="281.0" width="142.87999999999997" height="38" rx="19.0" fill="#131b2b" stroke="#3a4a63" stroke-width="2" opacity="0.94"/><text x="458" y="306.0" fill="#42c8ff" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" text-anchor="start">같은 비율 위치로</text><rect x="56" y="540" width="988" height="100" rx="18" fill="#131b2b" stroke="#32b466" stroke-width="2"/><text x="88" y="580" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="600" text-anchor="start">누른 채 0.8초 멈추면 그 자리에 점이 찍혀요.</text><text x="88" y="618" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="start">실제 기기에서는 이 자리에 오른손 검지 끝의 위치가 들어옵니다.</text>
</svg>
