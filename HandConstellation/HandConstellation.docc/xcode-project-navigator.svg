  <title id="t">Project navigator의 기본 파일</title><desc id="d">Project navigator에서 앱 진입점 파일과 ContentView.swift가 파란색으로 강조된 화면</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263654"/><stop offset="1" stop-color="#0e111c"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#8adfff" stop-opacity=".07"/></linearGradient><marker id="head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#42c8ff"/></marker><marker id="headw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8faabd"/></marker></defs>
  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">Xcode가 만들어 준 파일</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">Project navigator</text><rect x="854" y="46" width="190" height="40" rx="20" fill="none" stroke="#ff6a3d" stroke-width="2" stroke-dasharray="8 6"/><text x="949.0" y="73" fill="#ff6a3d" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="600" text-anchor="middle">실제 캡처 예정</text><rect x="72" y="168" width="956" height="470" rx="20" fill="#0b1120" stroke="#3a4a63" stroke-width="2"/><path d="M72 224 h956" stroke="#3a4a63" stroke-width="2"/><circle cx="100" cy="196" r="8" fill="#ff5f57"/><circle cx="124" cy="196" r="8" fill="#febc2e"/><circle cx="148" cy="196" r="8" fill="#28c840"/><text x="550.0" y="204" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="600" text-anchor="middle">HandConstellation.xcodeproj</text><rect x="104" y="246" width="340" height="360" rx="16" fill="#0e1524" stroke="#3a4a63" stroke-width="2"/><text x="126" y="292" fill="#d7e3eb" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="18" font-weight="400" text-anchor="start">HandConstellation</text><rect x="112" y="312" width="324" height="40" rx="9" fill="#1677ff" opacity="0.28"/><text x="152" y="340" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="18" font-weight="650" text-anchor="start">HandConstellationApp.swift</text><rect x="112" y="360" width="324" height="40" rx="9" fill="#1677ff" opacity="0.28"/><text x="152" y="388" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="18" font-weight="650" text-anchor="start">ContentView.swift</text><text x="152" y="436" fill="#d7e3eb" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="18" font-weight="400" text-anchor="start">Assets.xcassets</text><text x="152" y="484" fill="#d7e3eb" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="18" font-weight="400" text-anchor="start">Info.plist</text><text x="152" y="532" fill="#d7e3eb" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="18" font-weight="400" text-anchor="start">Preview Content</text><rect x="476" y="250" width="264" height="170" rx="22" fill="#111726" stroke="#42c8ff" stroke-width="2"/><rect x="476" y="250" width="6" height="170" rx="3" fill="#42c8ff"/><text x="502" y="294" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="25" font-weight="650" text-anchor="start">앱 진입점</text><text x="502" y="334" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">@main이 붙은 타입</text><text x="502" y="366" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">처음 열 창을 정함</text><rect x="476" y="442" width="264" height="164" rx="22" fill="#111726" stroke="#42c8ff" stroke-width="2"/><rect x="476" y="442" width="6" height="164" rx="3" fill="#42c8ff"/><text x="502" y="486" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="25" font-weight="650" text-anchor="start">첫 화면</text><text x="502" y="526" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">Hello, world! 표시</text><text x="502" y="558" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">곧 ControlView가 됨</text><line x1="452" y1="322" x2="470" y2="322" stroke="#42c8ff" stroke-width="5" stroke-linecap="round"/><path d="M0 0 L-15 8.25 L-15 -8.25 z" fill="#42c8ff" transform="translate(470 322) rotate(0.0)"/><line x1="452" y1="370" x2="470" y2="500" stroke="#42c8ff" stroke-width="5" stroke-linecap="round"/><path d="M0 0 L-15 8.25 L-15 -8.25 z" fill="#42c8ff" transform="translate(470 500) rotate(82.11686068327027)"/><rect x="772" y="250" width="220" height="356" rx="18" fill="#131b2b" stroke="#3a4a63" stroke-width="2"/><text x="796" y="294" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="650" text-anchor="start">이번 페이지는</text><text x="796" y="334" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">읽기만 합니다.</text><text x="796" y="380" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">코드를 아직</text><text x="796" y="412" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">바꾸지 않습니다.</text>
