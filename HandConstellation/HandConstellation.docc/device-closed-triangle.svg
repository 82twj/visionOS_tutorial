<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">닫힌 삼각형 완성 결과</title><desc id="d">노란 점 세 개와 파란 선 세 개로 정확히 닫힌 삼각형, 첫 점 완료 강조와 제어창 안내</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263654"/><stop offset="1" stop-color="#0e111c"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#8adfff" stop-opacity=".07"/></linearGradient><marker id="head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#42c8ff"/></marker><marker id="headw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8faabd"/></marker></defs>
  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">세 점으로 완성한 닫힌 삼각형</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">처음 점에서 0.8초 머물러 닫기</text><rect x="56" y="160" width="700" height="420" rx="26" fill="#070b15" stroke="#42c8ff" stroke-width="2" opacity="0.65"/><line x1="190" y1="470" x2="390" y2="230" stroke="#42c8ff" stroke-width="9" stroke-linecap="round"/><line x1="390" y1="230" x2="620" y2="470" stroke="#42c8ff" stroke-width="9" stroke-linecap="round"/><line x1="620" y1="470" x2="190" y2="470" stroke="#42c8ff" stroke-width="9" stroke-linecap="round"/><circle cx="190" cy="470" r="16" fill="#ffd14a" stroke="#fff1a8" stroke-width="5"/><text x="190" y="438" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="700" text-anchor="middle">1</text><circle cx="390" cy="230" r="16" fill="#ffd14a" stroke="#fff1a8" stroke-width="5"/><text x="390" y="198" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="700" text-anchor="middle">2</text><circle cx="620" cy="470" r="16" fill="#ffd14a" stroke="#fff1a8" stroke-width="5"/><text x="620" y="438" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="700" text-anchor="middle">3</text><circle cx="190" cy="470" r="34" fill="none" stroke="#32b466" stroke-width="6"/><rect x="784" y="160" width="260" height="200" rx="22" fill="#111726" stroke="#32b466" stroke-width="2"/><rect x="784" y="160" width="6" height="200" rx="3" fill="#32b466"/><text x="810" y="204" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="25" font-weight="650" text-anchor="start">완료 상태</text><text x="810" y="244" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">별자리 1개</text><text x="810" y="276" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">점 3개</text><text x="810" y="308" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">선 3개</text><rect x="784" y="380" width="260" height="200" rx="22" fill="#111726" stroke="#42c8ff" stroke-width="2"/><rect x="784" y="380" width="6" height="200" rx="3" fill="#42c8ff"/><text x="810" y="424" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="25" font-weight="650" text-anchor="start">제어창 안내</text><text x="810" y="464" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">도형이 닫혔어요</text><text x="810" y="496" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">손을 옮기면</text><text x="810" y="528" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">새 별자리 시작</text><rect x="56" y="606" width="988" height="62" rx="16" fill="#131b2b" stroke="#3a4a63" stroke-width="2"/><text x="88" y="644" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">첫 점을 복제하지 않으므로 네 번째 점 없이 세 변이 정확히 만납니다.</text>
</svg>
