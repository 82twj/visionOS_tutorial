<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">기존 점을 다시 이은 첫 별자리</title><desc id="d">흰 점 A, B, C, D와 흰 선 A–B, B–C, C–D, D–A, A–C로 이루어진 별자리 1개 · 점 4개 · 선 5개, 방금 연결한 C의 완료 표시, 제어창 안내 문구</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263654"/><stop offset="1" stop-color="#0e111c"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#8adfff" stop-opacity=".07"/></linearGradient><marker id="head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#42c8ff"/></marker><marker id="headw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8faabd"/></marker></defs>
  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">기존 점을 다시 이은 첫 별자리</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">개념도 · A–B–C–D를 찍은 뒤 D–A, A–C 선을 더한 결과</text><rect x="56" y="160" width="584" height="420" rx="26" fill="#070b15" stroke="#42c8ff" stroke-width="2" opacity="0.65"/><line x1="150.0" y1="470.0" x2="262.0" y2="255.0" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.92"/><line x1="262.0" y1="255.0" x2="480.0" y2="300.0" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.92"/><line x1="480.0" y1="300.0" x2="530.0" y2="495.0" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.92"/><line x1="530.0" y1="495.0" x2="150.0" y2="470.0" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.92"/><line x1="150.0" y1="470.0" x2="480.0" y2="300.0" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.92"/><circle cx="150.0" cy="470.0" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="5" opacity="1.00"/><circle cx="262.0" cy="255.0" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="5" opacity="1.00"/><circle cx="480.0" cy="300.0" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="5" opacity="1.00"/><circle cx="530.0" cy="495.0" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="5" opacity="1.00"/><text x="114" y="478" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" text-anchor="middle">A</text><text x="262" y="223" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" text-anchor="middle">B</text><text x="536" y="306" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" text-anchor="middle">C</text><text x="560" y="529" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" text-anchor="middle">D</text><circle cx="480.0" cy="300.0" r="41.6" fill="#ffffff" opacity="0.20"/><circle cx="480.0" cy="300.0" r="41.6" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.50"/><line x1="507" y1="230" x2="488" y2="262" stroke="#8faabd" stroke-width="2"/><circle cx="488" cy="262" r="4" fill="#8faabd"/><rect x="440" y="196" width="134.07999999999998" height="39" rx="19.5" fill="#131b2b" stroke="#3a4a63" stroke-width="2" opacity="0.94"/><text x="454" y="222" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="600" text-anchor="start">연결 완료 표시</text><rect x="664" y="160" width="380" height="140" rx="22" fill="#111726" stroke="#32b466" stroke-width="2"/><rect x="664" y="160" width="6" height="140" rx="3" fill="#32b466"/><text x="690" y="204" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="25" font-weight="650" text-anchor="start">완료 상태</text><text x="690" y="246" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="600" text-anchor="start">별자리 1개 · 점 4개 · 선 5개</text><text x="690" y="278" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="400" text-anchor="start">선: A–B · B–C · C–D · D–A · A–C</text><rect x="664" y="320" width="380" height="260" rx="22" fill="#111726" stroke="#42c8ff" stroke-width="2"/><rect x="664" y="320" width="6" height="260" rx="3" fill="#42c8ff"/><text x="690" y="364" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="25" font-weight="650" text-anchor="start">제어창 안내</text><text x="690" y="402" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="400" text-anchor="start">기존 점에 연결했을 때</text><text x="690" y="430" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">기존 점에 연결됐어요.</text><text x="690" y="456" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">이 점에서 계속 그릴 수 있어요.</text><text x="690" y="496" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="400" text-anchor="start">이미 선으로 이어진 점을 고르면</text><text x="690" y="524" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">이미 연결된 점이에요.</text><text x="690" y="550" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">다른 기존 점을 선택해 주세요.</text><rect x="56" y="606" width="988" height="62" rx="16" fill="#131b2b" stroke="#3a4a63" stroke-width="2"/><text x="88" y="644" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">기존 점에 다시 연결하면 새 점 없이 선만 늘어나므로 점 개수는 4개 그대로입니다.</text>
</svg>
