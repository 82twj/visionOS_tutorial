<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">모든 기존 점 연결 결과</title><desc id="d">흰 점 네 개와 흰 선 다섯 개로 만든 그래프, 기존 점 연결 완료 안내</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263654"/><stop offset="1" stop-color="#0e111c"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#8adfff" stop-opacity=".07"/></linearGradient><marker id="head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#42c8ff"/></marker><marker id="headw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8faabd"/></marker></defs>
  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">기존 점을 다시 이은 첫 별자리</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">어느 기존 점에서든 0.8초 머물러 선 추가</text><rect x="56" y="160" width="700" height="420" rx="26" fill="#070b15" stroke="#42c8ff" stroke-width="2" opacity="0.65"/><line x1="170" y1="470" x2="350" y2="230" stroke="#f5f7fa" stroke-width="7" stroke-linecap="round" opacity=".92"/><line x1="350" y1="230" x2="590" y2="300" stroke="#f5f7fa" stroke-width="7" stroke-linecap="round" opacity=".92"/><line x1="590" y1="300" x2="640" y2="500" stroke="#f5f7fa" stroke-width="7" stroke-linecap="round" opacity=".92"/><line x1="640" y1="500" x2="170" y2="470" stroke="#f5f7fa" stroke-width="7" stroke-linecap="round" opacity=".92"/><line x1="170" y1="470" x2="590" y2="300" stroke="#f5f7fa" stroke-width="7" stroke-linecap="round" opacity=".92"/><circle cx="170" cy="470" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="4"/><text x="170" y="438" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="700" text-anchor="middle">1</text><circle cx="350" cy="230" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="4"/><text x="350" y="198" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="700" text-anchor="middle">2</text><circle cx="590" cy="300" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="4"/><text x="590" y="268" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="700" text-anchor="middle">3</text><circle cx="640" cy="500" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="4"/><text x="640" y="468" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="700" text-anchor="middle">4</text><circle cx="590" cy="300" r="34" fill="none" stroke="#f5f7fa" stroke-width="6" opacity=".5"/><rect x="784" y="160" width="260" height="200" rx="22" fill="#111726" stroke="#32b466" stroke-width="2"/><rect x="784" y="160" width="6" height="200" rx="3" fill="#32b466"/><text x="810" y="204" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="25" font-weight="650" text-anchor="start">완료 상태</text><text x="810" y="244" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">별자리 1개</text><text x="810" y="276" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">점 4개</text><text x="810" y="308" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">선 5개</text><rect x="784" y="380" width="260" height="200" rx="22" fill="#111726" stroke="#42c8ff" stroke-width="2"/><rect x="784" y="380" width="6" height="200" rx="3" fill="#42c8ff"/><text x="810" y="424" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="25" font-weight="650" text-anchor="start">제어창 안내</text><text x="810" y="464" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">기존 점에 연결했어요</text><text x="810" y="496" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">이미 있는 선은</text><text x="810" y="528" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">중복 생성하지 않음</text><rect x="56" y="606" width="988" height="62" rx="16" fill="#131b2b" stroke="#3a4a63" stroke-width="2"/><text x="88" y="644" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">기존 점을 복제하지 않고 간선만 추가하므로 점 개수는 그대로 유지됩니다.</text>
</svg>
