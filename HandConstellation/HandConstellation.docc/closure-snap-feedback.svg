<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">기존 점에 다시 연결하기</title><desc id="d">점 C를 찍은 뒤 3cm 안의 기존 점 A가 목표로 강조되고 C–A 미리보기 선이 보이는 장면(4cm 밖으로 나가면 목표를 놓음), 0.8초 머무르는 동안 커서와 강조가 커지는 장면, 점 수는 그대로 두고 C–A 선만 추가된 장면</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263654"/><stop offset="1" stop-color="#0e111c"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#8adfff" stop-opacity=".07"/></linearGradient><marker id="head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#42c8ff"/></marker><marker id="headw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8faabd"/></marker></defs>
  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">기존 점에 다시 연결하기</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">개념도 · 새 점 대신 이미 찍은 점을 목표로 골라 선만 잇습니다</text><rect x="56" y="158" width="316" height="420" rx="24" fill="#070b15" stroke="#3a4a63" stroke-width="2" opacity="0.72"/><text x="80" y="202" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="650" text-anchor="start">1. 3cm 안의 점이 목표</text><text x="80" y="562" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="400" text-anchor="start">별자리 1개 · 점 3개 · 선 2개</text><line x1="166.0" y1="400.0" x2="246.0" y2="250.0" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.92"/><line x1="246.0" y1="250.0" x2="328.0" y2="392.0" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.92"/><line x1="328.0" y1="392.0" x2="166.0" y2="400.0" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.38"/><circle cx="166.0" cy="400.0" r="26.0" fill="#ffffff" opacity="0.20"/><circle cx="166.0" cy="400.0" r="26.0" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.50"/><circle cx="166.0" cy="400.0" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="5" opacity="1.00"/><circle cx="246.0" cy="250.0" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="5" opacity="1.00"/><circle cx="328.0" cy="392.0" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="5" opacity="1.00"/><text x="136" y="446" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" text-anchor="middle">A</text><text x="274" y="256" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" text-anchor="middle">B</text><text x="358" y="370" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" text-anchor="middle">C</text><circle cx="166" cy="400" r="66" fill="none" stroke="#42c8ff" stroke-width="3" stroke-dasharray="6 8"/><circle cx="166" cy="400" r="88" fill="none" stroke="#8faabd" stroke-width="2.5" stroke-dasharray="2 7"/><circle cx="128.0" cy="374.0" r="24.3" fill="#ffffff" opacity=".10"/><circle cx="128.0" cy="374.0" r="15.3" fill="#ffffff" opacity="1"/><line x1="96" y1="300" x2="120" y2="360" stroke="#8faabd" stroke-width="2"/><circle cx="120" cy="360" r="4" fill="#8faabd"/><text x="82" y="292" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="600" text-anchor="start">커서</text><text x="260" y="428" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" text-anchor="start">미리보기 선</text><line x1="80" y1="503" x2="104" y2="503" stroke="#42c8ff" stroke-width="3" stroke-dasharray="6 8"/><text x="112" y="508" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">3cm 안: 목표로 고름</text><line x1="80" y1="527" x2="104" y2="527" stroke="#8faabd" stroke-width="3" stroke-dasharray="2 7"/><text x="112" y="532" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="14" font-weight="400" text-anchor="start">4cm 밖으로 나가면 놓음</text><rect x="392" y="158" width="316" height="420" rx="24" fill="#070b15" stroke="#3a4a63" stroke-width="2" opacity="0.72"/><text x="416" y="202" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="650" text-anchor="start">2. 0.8초 머무르기</text><text x="416" y="562" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="400" text-anchor="start">별자리 1개 · 점 3개 · 선 2개</text><line x1="502.0" y1="400.0" x2="582.0" y2="250.0" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.92"/><line x1="582.0" y1="250.0" x2="664.0" y2="392.0" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.92"/><line x1="664.0" y1="392.0" x2="502.0" y2="400.0" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.38"/><circle cx="502.0" cy="400.0" r="35.4" fill="#ffffff" opacity="0.20"/><circle cx="502.0" cy="400.0" r="35.4" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.50"/><circle cx="502.0" cy="400.0" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="5" opacity="1.00"/><circle cx="582.0" cy="250.0" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="5" opacity="1.00"/><circle cx="664.0" cy="392.0" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="5" opacity="1.00"/><text x="472" y="446" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" text-anchor="middle">A</text><text x="610" y="256" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" text-anchor="middle">B</text><text x="694" y="370" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" text-anchor="middle">C</text><circle cx="506.0" cy="397.0" r="32.1" fill="#ffffff" opacity=".10"/><circle cx="506.0" cy="397.0" r="23.1" fill="#ffffff" opacity="1"/><text x="568" y="500" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" text-anchor="middle">커서와 강조 표시가 커집니다</text><rect x="728" y="158" width="316" height="420" rx="24" fill="#070b15" stroke="#3a4a63" stroke-width="2" opacity="0.72"/><text x="752" y="202" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="650" text-anchor="start">3. 선만 추가</text><text x="752" y="562" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="400" text-anchor="start">별자리 1개 · 점 3개 · 선 3개</text><line x1="838.0" y1="400.0" x2="918.0" y2="250.0" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.92"/><line x1="918.0" y1="250.0" x2="1000.0" y2="392.0" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.92"/><line x1="1000.0" y1="392.0" x2="838.0" y2="400.0" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.92"/><circle cx="838.0" cy="400.0" r="41.6" fill="#ffffff" opacity="0.20"/><circle cx="838.0" cy="400.0" r="41.6" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.50"/><circle cx="838.0" cy="400.0" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="5" opacity="1.00"/><circle cx="918.0" cy="250.0" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="5" opacity="1.00"/><circle cx="1000.0" cy="392.0" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="5" opacity="1.00"/><text x="808" y="446" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" text-anchor="middle">A</text><text x="946" y="256" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" text-anchor="middle">B</text><text x="1030" y="370" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" text-anchor="middle">C</text><text x="904" y="500" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" text-anchor="middle">C–A 선이 생깁니다</text><rect x="56" y="606" width="988" height="62" rx="16" fill="#131b2b" stroke="#32b466" stroke-width="2"/><text x="88" y="644" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">선의 끝은 손가락 위치가 아니라 저장된 점의 위치라서 기존 점과 정확히 만납니다.</text>
