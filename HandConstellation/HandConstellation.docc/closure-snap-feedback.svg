<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">모든 기존 점으로 다시 연결</title><desc id="d">여러 기존 점 중 목표 선택, dwell 미리보기, 점을 추가하지 않는 연결 완료 상태</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263654"/><stop offset="1" stop-color="#0e111c"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#8adfff" stop-opacity=".07"/></linearGradient><marker id="head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#42c8ff"/></marker><marker id="headw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8faabd"/></marker></defs>
  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">어느 기존 점으로든 다시 연결</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">새 점 대신 저장된 목표 노드를 선택합니다</text><rect x="56" y="158" width="316" height="420" rx="24" fill="#070b15" stroke="#3a4a63" stroke-width="2" opacity="0.72"/><text x="80" y="202" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="650" text-anchor="start">1. 목표 선택</text><text x="80" y="548" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="start">가까운 기존 점을 고정</text><rect x="392" y="158" width="316" height="420" rx="24" fill="#070b15" stroke="#3a4a63" stroke-width="2" opacity="0.72"/><text x="416" y="202" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="650" text-anchor="start">2. 목표에서 머무르기</text><text x="416" y="548" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="start">미리보기 선과 진행률</text><rect x="728" y="158" width="316" height="420" rx="24" fill="#070b15" stroke="#3a4a63" stroke-width="2" opacity="0.72"/><text x="752" y="202" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="650" text-anchor="start">3. 연결 완료</text><text x="752" y="548" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="start">점 수 유지 · 선만 추가</text><line x1="118" y1="452" x2="214" y2="278" stroke="#f5f7fa" stroke-width="9" stroke-linecap="round"/><line x1="214" y1="278" x2="318" y2="448" stroke="#f5f7fa" stroke-width="9" stroke-linecap="round"/><circle cx="118" cy="452" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="5"/><circle cx="214" cy="278" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="5"/><circle cx="318" cy="448" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="5"/><circle cx="118" cy="452" r="31" fill="none" stroke="#f5f7fa" stroke-width="6" opacity=".65"/><line x1="454" y1="452" x2="550" y2="278" stroke="#f5f7fa" stroke-width="9" stroke-linecap="round"/><line x1="550" y1="278" x2="654" y2="448" stroke="#f5f7fa" stroke-width="9" stroke-linecap="round"/><circle cx="454" cy="452" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="5"/><circle cx="550" cy="278" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="5"/><circle cx="654" cy="448" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="5"/><circle cx="454" cy="452" r="31" fill="none" stroke="#f5f7fa" stroke-width="6" opacity=".65"/><line x1="654" y1="448" x2="454" y2="452" stroke="#f5f7fa" stroke-width="6" stroke-dasharray="14 10" opacity=".45"/><circle cx="470" cy="440" r="16" fill="#f5f7fa" opacity=".72"/><text x="506" y="418" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" text-anchor="start">검지 커서</text><line x1="790" y1="452" x2="886" y2="278" stroke="#f5f7fa" stroke-width="9" stroke-linecap="round"/><line x1="886" y1="278" x2="990" y2="448" stroke="#f5f7fa" stroke-width="9" stroke-linecap="round"/><circle cx="790" cy="452" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="5"/><circle cx="886" cy="278" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="5"/><circle cx="990" cy="448" r="16" fill="#f5f7fa" stroke="#ffffff" stroke-width="5"/><line x1="990" y1="448" x2="790" y2="452" stroke="#f5f7fa" stroke-width="9" stroke-linecap="round"/><circle cx="790" cy="452" r="31" fill="none" stroke="#f5f7fa" stroke-width="6" opacity=".65"/><rect x="56" y="606" width="988" height="62" rx="16" fill="#131b2b" stroke="#32b466" stroke-width="2"/><text x="88" y="644" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">선의 끝은 손가락 좌표가 아니라 저장된 목표 점 좌표이므로 정확히 만납니다.</text>
</svg>
