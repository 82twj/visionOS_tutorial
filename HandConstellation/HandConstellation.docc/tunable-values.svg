<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">조절 가능한 설정값</title><desc id="d">체류 판정, 점과 선, 주먹 손짓 세 묶음으로 나눈 설정값과 미터 단위 환산 표</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263654"/><stop offset="1" stop-color="#0e111c"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#8adfff" stop-opacity=".07"/></linearGradient><marker id="head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#42c8ff"/></marker><marker id="headw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8faabd"/></marker></defs>
  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">한곳에 모으는 조절 값</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">ConstellationConfiguration</text><rect x="56" y="170" width="320" height="330" rx="22" fill="#111726" stroke="#32b466" stroke-width="2"/><rect x="56" y="170" width="6" height="330" rx="3" fill="#32b466"/><text x="82" y="214" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="25" font-weight="650" text-anchor="start">체류 판정</text><text x="82" y="262" fill="#32b466" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="17" font-weight="600" text-anchor="start">dwellDuration</text><text x="82" y="292" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">0.8초</text><text x="82" y="336" fill="#32b466" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="17" font-weight="600" text-anchor="start">stabilityRadius</text><text x="82" y="366" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">0.015 m = 1.5cm</text><text x="82" y="410" fill="#32b466" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="17" font-weight="600" text-anchor="start">rearmDistance</text><text x="82" y="440" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">0.030 m = 3cm</text><rect x="392" y="170" width="320" height="404" rx="22" fill="#111726" stroke="#ffd14a" stroke-width="2"/><rect x="392" y="170" width="6" height="404" rx="3" fill="#ffd14a"/><text x="418" y="214" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="25" font-weight="650" text-anchor="start">점과 선</text><text x="418" y="262" fill="#ffd14a" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="17" font-weight="600" text-anchor="start">minimumPointDistance</text><text x="418" y="292" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">0.030 m = 3cm</text><text x="418" y="336" fill="#ffd14a" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="17" font-weight="600" text-anchor="start">pointRadius</text><text x="418" y="366" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">0.008 m = 8mm</text><text x="418" y="410" fill="#ffd14a" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="17" font-weight="600" text-anchor="start">lineRadius</text><text x="418" y="440" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">0.0025 m = 2.5mm</text><text x="418" y="484" fill="#ffd14a" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="17" font-weight="600" text-anchor="start">cursorRadius</text><text x="418" y="514" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">0.006 m = 6mm</text><rect x="728" y="170" width="320" height="256" rx="22" fill="#111726" stroke="#ff6a3d" stroke-width="2"/><rect x="728" y="170" width="6" height="256" rx="3" fill="#ff6a3d"/><text x="754" y="214" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="25" font-weight="650" text-anchor="start">주먹 손짓</text><text x="754" y="262" fill="#ff6a3d" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="17" font-weight="600" text-anchor="start">fistHoldDuration</text><text x="754" y="292" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">0.6초</text><text x="754" y="336" fill="#ff6a3d" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="17" font-weight="600" text-anchor="start">fistFingerExtensionRatio</text><text x="754" y="366" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">1.45 (비율)</text><rect x="56" y="596" width="988" height="62" rx="16" fill="#131b2b" stroke="#42c8ff" stroke-width="2"/><text x="88" y="634" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">ARKit과 RealityKit의 거리 단위는 미터입니다. 0.015는 1.5cm를 뜻합니다.</text>
</svg>
