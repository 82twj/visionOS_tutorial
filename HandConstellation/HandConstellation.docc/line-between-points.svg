  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">두 점 사이에 선 그리기</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">개념도 · 원기둥 하나로 두 점을 잇는 방법</text><rect x="56" y="150" width="316" height="370" rx="24" fill="#070b15" stroke="#3a4a63" stroke-width="2" opacity="0.72"/><text x="80" y="192" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="650" text-anchor="start">① 길이를 정해 만들기</text><text x="80" y="452" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="400" text-anchor="start">높이 = 두 점 사이 거리 0.10</text><text x="80" y="476" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="400" text-anchor="start">아직 원점에서 y축 방향으로 섬</text><text x="80" y="504" fill="#8edfff" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" font-weight="500" text-anchor="start">generateCylinder(height:radius:)</text><line x1="214" y1="422" x2="214" y2="230" stroke="#8faabd" stroke-width="2" stroke-dasharray="5 6"/><path d="M0 0 L-11 6.050000000000001 L-11 -6.050000000000001 z" fill="#8faabd" transform="translate(214 224) rotate(-90)"/><text x="226" y="234" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="600" text-anchor="start">y</text><line x1="214.0" y1="255.0" x2="214.0" y2="405.0" stroke="#ffffff" stroke-width="14" opacity="0.95"/><circle cx="214" cy="330" r="5" fill="#42c8ff"/><text x="196" y="336" fill="#42c8ff" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="600" text-anchor="end">원점</text><path d="M244 254.99999999999997 h8 V 405.0 h-8" fill="none" stroke="#42c8ff" stroke-width="2"/><text x="260" y="336" fill="#42c8ff" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="650" text-anchor="start">0.10</text><rect x="392" y="150" width="316" height="370" rx="24" fill="#070b15" stroke="#3a4a63" stroke-width="2" opacity="0.72"/><text x="416" y="192" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="650" text-anchor="start">② 중점으로 옮기기</text><text x="416" y="452" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="400" text-anchor="start">중점 (0.03, 1.04, −0.5)</text><text x="416" y="476" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="400" text-anchor="start">방향은 아직 y축 그대로</text><line x1="505.0" y1="390.0" x2="595.0" y2="270.0" stroke="#8faabd" stroke-width="2" stroke-dasharray="4 6"/><line x1="550.0" y1="255.0" x2="550.0" y2="405.0" stroke="#ffffff" stroke-width="14" opacity="0.95"/><circle cx="505.0" cy="390.0" r="11" fill="#f5f7fa" stroke="#ffffff" stroke-width="5" opacity="1.00"/><circle cx="595.0" cy="270.0" r="11" fill="#f5f7fa" stroke="#ffffff" stroke-width="5" opacity="1.00"/><circle cx="550" cy="330" r="7" fill="none" stroke="#42c8ff" stroke-width="3"/><text x="532" y="336" fill="#42c8ff" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="600" text-anchor="end">중점</text><text x="481.0" y="396.0" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" text-anchor="middle">A</text><text x="619.0" y="276.0" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" text-anchor="middle">B</text><rect x="728" y="150" width="316" height="370" rx="24" fill="#070b15" stroke="#3a4a63" stroke-width="2" opacity="0.72"/><text x="752" y="192" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="650" text-anchor="start">③ 두 점 방향으로 기울이기</text><text x="752" y="452" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="400" text-anchor="start">y축 (0, 1, 0) → 방향 (0.6, 0.8, 0)</text><text x="752" y="476" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="400" text-anchor="start">약 37° 기울면 A와 B에 닿음</text><text x="752" y="504" fill="#8edfff" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" font-weight="500" text-anchor="start">simd_quatf(from:to:)</text><line x1="886.0" y1="255.0" x2="886.0" y2="405.0" stroke="#8faabd" stroke-width="14" stroke-dasharray="6 6" opacity=".55"/><line x1="841.0" y1="390.0" x2="931.0" y2="270.0" stroke="#ffffff" stroke-width="14" opacity="0.95"/><circle cx="841.0" cy="390.0" r="11" fill="#f5f7fa" stroke="#ffffff" stroke-width="5" opacity="1.00"/><circle cx="931.0" cy="270.0" r="11" fill="#f5f7fa" stroke="#ffffff" stroke-width="5" opacity="1.00"/><line x1="886" y1="255.0" x2="886.0" y2="220.0" stroke="#8faabd" stroke-width="2" stroke-dasharray="4 5"/><line x1="931.0" y1="270.0" x2="948.4" y2="246.8" stroke="#8faabd" stroke-width="2" stroke-dasharray="4 5"/><path d="M886.0 226.0 A104 104 0 0 1 948.4 246.8" fill="none" stroke="#42c8ff" stroke-width="3"/><text x="960.4" y="242.8" fill="#42c8ff" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="650" text-anchor="start">약 37°</text><text x="817.0" y="396.0" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" text-anchor="middle">A</text><text x="955.0" y="276.0" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="700" text-anchor="middle">B</text><rect x="56" y="540" width="988" height="112" rx="18" fill="#131b2b" stroke="#3a4a63" stroke-width="2"/><text x="88" y="582" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">A (0, 1, −0.5) · B (0.06, 1.08, −0.5) · 차이 B − A = (0.06, 0.08, 0)</text><text x="88" y="622" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">길이 = 차이의 크기 0.10 · 방향 = 차이 ÷ 길이 = (0.6, 0.8, 0) · 단위 m</text>
