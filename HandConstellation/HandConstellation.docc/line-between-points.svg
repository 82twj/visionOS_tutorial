<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">두 점 사이에 선 그리기</title><desc id="d">높이 0.10m인 원기둥을 원점에서 y축 방향으로 만들고, A(0, 1, −0.5)와 B(0.06, 1.08, −0.5)의 중점 (0.03, 1.04, −0.5)로 옮긴 뒤, y축 (0, 1, 0)에서 방향 (0.6, 0.8, 0)으로 약 37° 기울여 두 점을 잇는 세 단계</desc>
