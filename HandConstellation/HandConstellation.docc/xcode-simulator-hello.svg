<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">Simulator의 기본 앱 실행 결과</title><desc id="d">실행 대상으로 Apple Vision Pro Simulator를 고르고 Hello, world! 창을 확인하는 화면</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263654"/><stop offset="1" stop-color="#0e111c"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#8adfff" stop-opacity=".07"/></linearGradient><marker id="head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#42c8ff"/></marker><marker id="headw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8faabd"/></marker></defs>
  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">Simulator에서 기본 앱 확인</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">Apple Vision Pro Simulator</text><rect x="854" y="46" width="190" height="40" rx="20" fill="none" stroke="#ff6a3d" stroke-width="2" stroke-dasharray="8 6"/><text x="949.0" y="73" fill="#ff6a3d" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="600" text-anchor="middle">실제 캡처 예정</text><rect x="72" y="168" width="470" height="470" rx="24" fill="#0b1120" stroke="#3a4a63" stroke-width="2"/><text x="104" y="216" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="600" text-anchor="start">Xcode 도구 막대</text><rect x="104" y="240" width="406" height="62" rx="14" fill="#131b2b" stroke="#1677ff" stroke-width="3"/><path d="M126 271 l0 -16 l18 16 l-18 16 z" fill="#32b466"/><text x="166" y="278" fill="#f5f7fa" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="19" font-weight="650" text-anchor="start">HandConstellation</text><text x="336" y="278" fill="#42c8ff" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="600" text-anchor="start">Apple Vision Pro</text><text x="104" y="348" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">실행 대상에서 Apple Vision Pro</text><text x="104" y="380" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">Simulator를 고르고 Run을 누릅니다.</text><rect x="104" y="424" width="406" height="176" rx="18" fill="#131b2b" stroke="#3a4a63" stroke-width="2"/><text x="130" y="468" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="650" text-anchor="start">이 단계의 목적</text><text x="130" y="508" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">손 추적이 아니라 프로젝트가</text><text x="130" y="540" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">정상적으로 만들어졌는지만</text><text x="130" y="572" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">확인합니다.</text><rect x="578" y="168" width="450" height="470" rx="30" fill="#070b15" stroke="#42c8ff" stroke-width="2" opacity="0.6"/><rect x="640" y="300" width="326" height="206" rx="26" fill="url(#glass)" stroke="#d8f5ff" stroke-width="2"/><circle cx="732" cy="376" r="26" fill="none" stroke="#42c8ff" stroke-width="6"/><path d="M706 376 h52 M732 350 v52" stroke="#42c8ff" stroke-width="6"/><text x="812" y="386" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="26" font-weight="650" text-anchor="middle">Hello, world!</text><text x="803" y="560" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="middle">기본 창이 보이면 성공입니다.</text>
</svg>
