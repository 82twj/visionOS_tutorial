<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Hand Constellation</title>
  <desc id="description">A hand draws two glowing constellations in a spatial scene while a glass control shows drawing enabled.</desc>
  <defs>
    <radialGradient id="bg" cx="48%" cy="36%" r="80%"><stop stop-color="#26385c"/><stop offset="1" stop-color="#090c16"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".24"/><stop offset="1" stop-color="#8adfff" stop-opacity=".08"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="900" rx="52" fill="url(#bg)"/>
  <g fill="#9be4ff" opacity=".35"><circle cx="115" cy="140" r="3"/><circle cx="245" cy="92" r="2"/><circle cx="395" cy="162" r="3"/><circle cx="770" cy="100" r="2"/><circle cx="1080" cy="188" r="3"/><circle cx="1040" cy="650" r="2"/><circle cx="180" cy="710" r="3"/></g>
  <g transform="translate(745 84)">
    <rect width="355" height="210" rx="30" fill="url(#glass)" stroke="#d8f5ff" stroke-opacity=".35"/>
    <circle cx="50" cy="50" r="17" fill="#69dc8e"/><text x="82" y="60" fill="#f6fbff" font-family="-apple-system,sans-serif" font-size="27" font-weight="650">그리기 켜짐</text>
    <rect x="34" y="96" width="287" height="1" fill="#fff" opacity=".18"/>
    <circle cx="52" cy="143" r="9" fill="#ffd14a"/><text x="78" y="151" fill="#dbe9f4" font-family="-apple-system,sans-serif" font-size="22">별자리 2개 · 점 10개</text>
  </g>
  <g fill="none" stroke="#42c8ff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <polyline points="160,540 290,350 455,470 565,255 700,405"/>
    <polyline points="745,560 840,430 965,520 1055,375"/>
  </g>
  <g fill="#ffd14a" stroke="#fff1a8" stroke-width="6" filter="url(#glow)">
    <circle cx="160" cy="540" r="17"/><circle cx="290" cy="350" r="17"/><circle cx="455" cy="470" r="17"/><circle cx="565" cy="255" r="17"/><circle cx="700" cy="405" r="17"/>
    <circle cx="745" cy="560" r="17"/><circle cx="840" cy="430" r="17"/><circle cx="965" cy="520" r="17"/><circle cx="1055" cy="375" r="17"/>
  </g>
  <g transform="translate(580 650) rotate(-12)">
    <path d="M0 105C48 60 90 32 120 38c24 5 29 25 18 44l-44 64c-13 20-50 30-79 20z" fill="#e9a98f"/>
    <rect x="111" y="-42" width="48" height="142" rx="24" fill="#f4b99f"/>
    <circle cx="135" cy="-58" r="27" fill="#ff6a3d" stroke="#ffc0aa" stroke-width="8" filter="url(#glow)"/>
  </g>
  <path d="M135 768C340 823 850 822 1070 750" fill="none" stroke="#8adfff" stroke-opacity=".15" stroke-width="2"/>
</svg>
