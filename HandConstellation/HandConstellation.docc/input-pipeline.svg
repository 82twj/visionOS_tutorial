<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">한 프레임의 입력 처리 순서</title><desc id="d">주먹 판정, 그리기 상태 검사, 체류 판정, 점 확정으로 이어지는 다섯 단계 순서도</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263654"/><stop offset="1" stop-color="#0e111c"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#8adfff" stop-opacity=".07"/></linearGradient><marker id="head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#42c8ff"/></marker><marker id="headw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8faabd"/></marker></defs>
  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">한 프레임의 입력 처리 순서</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">ImmersiveCoordinator.process(anchor:)</text><rect x="56" y="168" width="988" height="88" rx="18" fill="#111726" stroke="#ff6a3d" stroke-width="2"/><circle cx="106" cy="212" r="26" fill="#ff6a3d"/><text x="106" y="221" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="700" text-anchor="middle">1</text><text x="154" y="206" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="23" font-weight="650" text-anchor="start">주먹인지 먼저 판정</text><text x="154" y="238" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">제어 손짓이 그리기보다 우선</text><path d="M550 256 v 6" stroke="#3a4a63" stroke-width="3"/><path d="M0 0 L-12 6.6000000000000005 L-12 -6.6000000000000005 z" fill="#3a4a63" transform="translate(550 272) rotate(90)"/><rect x="56" y="274" width="988" height="88" rx="18" fill="#111726" stroke="#ff6a3d" stroke-width="2"/><circle cx="106" cy="318" r="26" fill="#ff6a3d"/><text x="106" y="327" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="700" text-anchor="middle">2</text><text x="154" y="312" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="23" font-weight="650" text-anchor="start">주먹이면 체류 취소 후 반환</text><text x="154" y="344" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">손짓 자체가 점이 되지 않음</text><path d="M550 362 v 6" stroke="#3a4a63" stroke-width="3"/><path d="M0 0 L-12 6.6000000000000005 L-12 -6.6000000000000005 z" fill="#3a4a63" transform="translate(550 378) rotate(90)"/><rect x="56" y="380" width="988" height="88" rx="18" fill="#111726" stroke="#8faabd" stroke-width="2"/><circle cx="106" cy="424" r="26" fill="#8faabd"/><text x="106" y="433" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="700" text-anchor="middle">3</text><text x="154" y="418" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="23" font-weight="650" text-anchor="start">그리기 꺼짐이면 반환</text><text x="154" y="450" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">꺼진 상태에서는 점이 생기지 않음</text><path d="M550 468 v 6" stroke="#3a4a63" stroke-width="3"/><path d="M0 0 L-12 6.6000000000000005 L-12 -6.6000000000000005 z" fill="#3a4a63" transform="translate(550 484) rotate(90)"/><rect x="56" y="486" width="988" height="88" rx="18" fill="#111726" stroke="#42c8ff" stroke-width="2"/><circle cx="106" cy="530" r="26" fill="#42c8ff"/><text x="106" y="539" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="700" text-anchor="middle">4</text><text x="154" y="524" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="23" font-weight="650" text-anchor="start">검지 위치를 체류 감지기로</text><text x="154" y="556" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">진행률로 커서를 키움</text><path d="M550 574 v 6" stroke="#3a4a63" stroke-width="3"/><path d="M0 0 L-12 6.6000000000000005 L-12 -6.6000000000000005 z" fill="#3a4a63" transform="translate(550 590) rotate(90)"/><rect x="56" y="592" width="988" height="88" rx="18" fill="#111726" stroke="#ffd14a" stroke-width="2"/><circle cx="106" cy="636" r="26" fill="#ffd14a"/><text x="106" y="645" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="700" text-anchor="middle">5</text><text x="154" y="630" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="23" font-weight="650" text-anchor="start">확정된 위치만 모델로</text><text x="154" y="662" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="400" text-anchor="start">모델이 허용할 때만 렌더러가 그림</text>
</svg>
