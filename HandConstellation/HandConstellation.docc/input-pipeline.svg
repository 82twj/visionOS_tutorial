<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">한 프레임의 입력 처리 순서</title><desc id="d">버튼 상태, 그리기 상태 검사, 검지 위치, 모든 기존 점 연결, 일반 점 체류와 모델 확정 순서도</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263654"/><stop offset="1" stop-color="#0e111c"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#8adfff" stop-opacity=".07"/></linearGradient><marker id="head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#42c8ff"/></marker><marker id="headw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8faabd"/></marker></defs>
  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">한 프레임의 입력 처리 순서</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">ImmersiveCoordinator.process(anchor:)</text><rect x="56" y="136" width="988" height="76" rx="16" fill="#111726" stroke="#ff6a3d" stroke-width="2"/><circle cx="106" cy="174" r="23" fill="#ff6a3d"/><text x="106" y="182" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="700" text-anchor="middle">1</text><text x="154" y="168" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="650" text-anchor="start">버튼 상태를 먼저 반영</text><text x="154" y="197" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="start">꺼지는 순간 현재 별자리 마침</text><path d="M550 212 v 4" stroke="#3a4a63" stroke-width="3"/><path d="M0 0 L-10 5.5 L-10 -5.5 z" fill="#3a4a63" transform="translate(550 224) rotate(90)"/><rect x="56" y="224" width="988" height="76" rx="16" fill="#111726" stroke="#8faabd" stroke-width="2"/><circle cx="106" cy="262" r="23" fill="#8faabd"/><text x="106" y="270" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="700" text-anchor="middle">2</text><text x="154" y="256" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="650" text-anchor="start">그리기 꺼짐이면 반환</text><text x="154" y="285" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="start">꺼진 상태에서는 점이 생기지 않음</text><path d="M550 300 v 4" stroke="#3a4a63" stroke-width="3"/><path d="M0 0 L-10 5.5 L-10 -5.5 z" fill="#3a4a63" transform="translate(550 312) rotate(90)"/><rect x="56" y="312" width="988" height="76" rx="16" fill="#111726" stroke="#42c8ff" stroke-width="2"/><circle cx="106" cy="350" r="23" fill="#42c8ff"/><text x="106" y="358" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="700" text-anchor="middle">3</text><text x="154" y="344" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="650" text-anchor="start">오른손 검지 위치 계산</text><text x="154" y="373" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="start">추적 손실이면 후보 입력 취소</text><path d="M550 388 v 4" stroke="#3a4a63" stroke-width="3"/><path d="M0 0 L-10 5.5 L-10 -5.5 z" fill="#3a4a63" transform="translate(550 400) rotate(90)"/><rect x="56" y="400" width="988" height="76" rx="16" fill="#111726" stroke="#32b466" stroke-width="2"/><circle cx="106" cy="438" r="23" fill="#32b466"/><text x="106" y="446" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="700" text-anchor="middle">4</text><text x="154" y="432" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="650" text-anchor="start">모든 기존 점 후보를 먼저</text><text x="154" y="461" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="start">스냅 영역이면 일반 점 입력을 멈춤</text><path d="M550 476 v 4" stroke="#3a4a63" stroke-width="3"/><path d="M0 0 L-10 5.5 L-10 -5.5 z" fill="#3a4a63" transform="translate(550 488) rotate(90)"/><rect x="56" y="488" width="988" height="76" rx="16" fill="#111726" stroke="#42c8ff" stroke-width="2"/><circle cx="106" cy="526" r="23" fill="#42c8ff"/><text x="106" y="534" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="700" text-anchor="middle">5</text><text x="154" y="520" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="650" text-anchor="start">그 밖의 위치는 점 체류로</text><text x="154" y="549" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="start">진행률로 커서를 키움</text><path d="M550 564 v 4" stroke="#3a4a63" stroke-width="3"/><path d="M0 0 L-10 5.5 L-10 -5.5 z" fill="#3a4a63" transform="translate(550 576) rotate(90)"/><rect x="56" y="576" width="988" height="76" rx="16" fill="#111726" stroke="#ffd14a" stroke-width="2"/><circle cx="106" cy="614" r="23" fill="#ffd14a"/><text x="106" y="622" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="700" text-anchor="middle">6</text><text x="154" y="608" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="21" font-weight="650" text-anchor="start">확정 결과만 모델로</text><text x="154" y="637" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="400" text-anchor="start">새 점 또는 기존 노드 간선 추가</text>
</svg>
