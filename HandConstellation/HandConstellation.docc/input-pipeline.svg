<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="t d">
  <title id="t">한 프레임의 입력 처리 순서</title><desc id="d">process(anchor:appModel:)에서 그리기 상태 반영, 꺼져 있으면 멈춤, 검지 끝 월드 좌표를 거쳐 process(position:at:appModel:)에서 유지 중인 안내, 기존 점 연결, 새 점 머무르기와 커서, 모델에 더하기와 렌더링으로 이어지는 순서도. Simulator 빌드에서는 입력 패드의 위치가 같은 process(position:)로 들어온다는 표시</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#263654"/><stop offset="1" stop-color="#0e111c"/></linearGradient><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#8adfff" stop-opacity=".07"/></linearGradient><marker id="head" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#42c8ff"/></marker><marker id="headw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 z" fill="#8faabd"/></marker></defs>
  <rect x="0" y="0" width="1100" height="720" rx="44" fill="url(#bg)"/>
  <text x="56" y="78" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="34" font-weight="700" text-anchor="start">한 프레임의 입력 처리 순서</text><text x="56" y="116" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="400" text-anchor="start">ImmersiveCoordinator · 오른손 앵커가 들어올 때마다</text><text x="56" y="160" fill="#8edfff" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="650" text-anchor="start">process(anchor:appModel:)</text><rect x="56" y="172" width="760" height="54" rx="14" fill="#111726" stroke="#ff6a3d" stroke-width="2"/><circle cx="92" cy="199" r="16" fill="#ff6a3d"/><text x="92" y="205" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">1</text><text x="124" y="195" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="650" text-anchor="start">그리기 상태 반영</text><text x="124" y="216" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" text-anchor="start">그리기를 끄는 순간 지금 그리던 별자리를 마칩니다</text><text x="798" y="216" fill="#8edfff" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" font-weight="500" text-anchor="end">applyDrawingState(appModel:)</text><path d="M436 226 v 3" stroke="#3a4a63" stroke-width="3"/><path d="M0 0 L-9 4.95 L-9 -4.95 z" fill="#3a4a63" transform="translate(436 237) rotate(90)"/><rect x="56" y="236" width="760" height="54" rx="14" fill="#111726" stroke="#8faabd" stroke-width="2"/><circle cx="92" cy="263" r="16" fill="#8faabd"/><text x="92" y="269" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">2</text><text x="124" y="259" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="650" text-anchor="start">그리기가 꺼져 있으면 머무르기를 취소하고 끝</text><text x="124" y="280" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" text-anchor="start">커서와 기존 점 연결 안내도 함께 숨깁니다</text><text x="798" y="280" fill="#8edfff" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" font-weight="500" text-anchor="end">cancelDwell()</text><path d="M436 290 v 3" stroke="#3a4a63" stroke-width="3"/><path d="M0 0 L-9 4.95 L-9 -4.95 z" fill="#3a4a63" transform="translate(436 301) rotate(90)"/><rect x="56" y="300" width="760" height="54" rx="14" fill="#111726" stroke="#42c8ff" stroke-width="2"/><circle cx="92" cy="327" r="16" fill="#42c8ff"/><text x="92" y="333" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">3</text><text x="124" y="323" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="650" text-anchor="start">검지 끝의 월드 좌표 구하기</text><text x="124" y="344" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" text-anchor="start">위치를 구할 수 없으면 머무르기를 취소하고 끝</text><text x="798" y="344" fill="#8edfff" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" font-weight="500" text-anchor="end">rightIndexFingerTipPosition(from:)</text><text x="56" y="390" fill="#8edfff" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="16" font-weight="650" text-anchor="start">process(position:at:appModel:)</text><rect x="56" y="402" width="760" height="54" rx="14" fill="#111726" stroke="#8faabd" stroke-width="2"/><circle cx="92" cy="429" r="16" fill="#8faabd"/><text x="92" y="435" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">4</text><text x="124" y="425" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="650" text-anchor="start">완료·거절 안내를 유지하는 중이면 여기서 끝</text><text x="124" y="446" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" text-anchor="start">손이 그 자리를 떠날 때까지 커서만 옮깁니다</text><text x="798" y="446" fill="#8edfff" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" font-weight="500" text-anchor="end">keepCompletionVisible · keepRejectionVisible</text><path d="M436 456 v 3" stroke="#3a4a63" stroke-width="3"/><path d="M0 0 L-9 4.95 L-9 -4.95 z" fill="#3a4a63" transform="translate(436 467) rotate(90)"/><rect x="56" y="466" width="760" height="54" rx="14" fill="#111726" stroke="#32b466" stroke-width="2"/><circle cx="92" cy="493" r="16" fill="#32b466"/><text x="92" y="499" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">5</text><text x="124" y="489" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="650" text-anchor="start">기존 점 연결을 먼저 확인</text><text x="124" y="510" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" text-anchor="start">목표에 머무르는 중이면 연결을 처리하고 여기서 끝</text><text x="798" y="510" fill="#8edfff" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" font-weight="500" text-anchor="end">connectionDetector.update</text><path d="M436 520 v 3" stroke="#3a4a63" stroke-width="3"/><path d="M0 0 L-9 4.95 L-9 -4.95 z" fill="#3a4a63" transform="translate(436 531) rotate(90)"/><rect x="56" y="530" width="760" height="54" rx="14" fill="#111726" stroke="#42c8ff" stroke-width="2"/><circle cx="92" cy="557" r="16" fill="#42c8ff"/><text x="92" y="563" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">6</text><text x="124" y="553" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="650" text-anchor="start">새 점 머무르기와 커서</text><text x="124" y="574" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" text-anchor="start">머무른 시간만큼 커서를 키웁니다</text><text x="798" y="574" fill="#8edfff" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" font-weight="500" text-anchor="end">dwellDetector.update · renderer.updateCursor</text><path d="M436 584 v 3" stroke="#3a4a63" stroke-width="3"/><path d="M0 0 L-9 4.95 L-9 -4.95 z" fill="#3a4a63" transform="translate(436 595) rotate(90)"/><rect x="56" y="594" width="760" height="54" rx="14" fill="#111726" stroke="#ffd14a" stroke-width="2"/><circle cx="92" cy="621" r="16" fill="#ffd14a"/><text x="92" y="627" fill="#0b1120" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="16" font-weight="700" text-anchor="middle">7</text><text x="124" y="617" fill="#f5f7fa" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="19" font-weight="650" text-anchor="start">점이 찍히면 모델에 더하고, 받아들인 점만 렌더러로 그림</text><text x="124" y="638" fill="#8faabd" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" text-anchor="start">거절된 점은 제어창 안내로 바뀝니다</text><text x="798" y="638" fill="#8edfff" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="14" font-weight="500" text-anchor="end">constellationModel.addPoint → renderer.addPoint</text><path d="M436 354 V 394" stroke="#3a4a63" stroke-width="3"/><path d="M0 0 L-9 4.95 L-9 -4.95 z" fill="#3a4a63" transform="translate(436 402) rotate(90)"/><rect x="836" y="306" width="208" height="160" rx="18" fill="#131b2b" stroke="#32b466" stroke-width="2" stroke-dasharray="7 6"/><text x="856" y="336" fill="#32b466" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="17" font-weight="650" text-anchor="start">Simulator 빌드</text><text x="856" y="364" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" text-anchor="start">손 앵커 대신 입력 패드에서</text><text x="856" y="388" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" text-anchor="start">누른 위치가 여기로</text><text x="856" y="412" fill="#d7e3eb" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="15" font-weight="400" text-anchor="start">process(position:)</text><text x="856" y="436" fill="#d7e3eb" font-family="-apple-system,'SF Pro Text','Apple SD Gothic Neo',sans-serif" font-size="15" font-weight="400" text-anchor="start">들어옵니다.</text><path d="M836 385 H 470" stroke="#32b466" stroke-width="2.5" stroke-dasharray="7 6"/><path d="M0 0 L-11 6.050000000000001 L-11 -6.050000000000001 z" fill="#32b466" transform="translate(462 385) rotate(180)"/>
</svg>
