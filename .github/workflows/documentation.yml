name: Deploy DocC to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build DocC archive
        run: |
          xcodebuild \
            -project HandConstellation.xcodeproj \
            -target HandConstellation \
            -configuration Release \
            -sdk xros \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$RUNNER_TEMP/Build" \
            OBJROOT="$RUNNER_TEMP/Intermediates" \
            DOCC_HOSTING_BASE_PATH="${{ github.event.repository.name }}" \
            docbuild

      - name: Prepare static site
        run: |
          archive="$RUNNER_TEMP/Build/Release-xros/HandConstellation.doccarchive"
          test -d "$archive"
          mkdir -p "$RUNNER_TEMP/site"
          cp -R "$archive/." "$RUNNER_TEMP/site/"
          touch "$RUNNER_TEMP/site/.nojekyll"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
